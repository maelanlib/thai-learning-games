<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมสวนผลไม้ภาษาไทย</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- เพิ่มไลบรารีเสียง Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --primary-bg: #87CEEB; /* สีฟ้าท้องฟ้าอ่อนๆ */
            --bubble-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.2) 100%);
            --bubble-border: rgba(255, 255, 255, 0.8);
            --bubble-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --text-color: #1a472a; /* สีเขียวเข้มอ่านง่าย */
            --danger-color: #ff6b6b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(to bottom, var(--primary-bg) 0%, #e0f6ff 60%, #c2f0c2 100%);
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
        }

        /* Ambient Background Bubbles */
        .ambient-bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: rise infinite linear;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
        }

        /* Glassmorphism Bubble Base Class */
        .glass-bubble {
            background: var(--bubble-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 2px solid var(--bubble-border);
            box-shadow: var(--bubble-shadow), inset 0 0 20px rgba(255,255,255,0.5);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
        }

        /* Bubble Highlight/Reflection */
        .glass-bubble::after {
            content: '';
            position: absolute;
            top: 5%;
            left: 10%;
            width: 30%;
            height: 30%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            transform: rotate(-45deg);
            pointer-events: none;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* Start & Game Over Screen UI */
        .modal-bubble {
            padding: 40px;
            text-align: center;
            max-width: 90%;
            width: 600px;
            border-radius: 50px;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 800;
            color: #d32f2f;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
            margin-bottom: 20px;
            line-height: 1.2;
        }

        p.subtitle {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 600;
            margin-bottom: 40px;
        }

        /* Buttons */
        .btn {
            font-family: 'Kanit', sans-serif;
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            font-weight: 600;
            color: #1a472a;
            padding: 15px 40px;
            margin: 10px;
            cursor: pointer;
            border-radius: 50px;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover, .btn:active {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.8);
        }

        /* Game HUD */
        #game-hud {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding: 0 20px;
            z-index: 20;
            gap: 15px;
        }

        .hud-item {
            padding: 15px 25px;
            text-align: center;
            min-width: 150px;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hud-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: #555;
        }

        .hud-value {
            font-size: 2.2rem;
            font-weight: 800;
        }

        #mission-hud {
            flex-grow: 1;
            max-width: 600px;
        }

        #mission-text {
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            font-weight: 800;
            color: #c62828;
        }

        .time-warning {
            color: var(--danger-color);
            animation: pulse-soft 1s infinite;
        }

        @keyframes pulse-soft {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Combo indicator */
        #combo-container {
            position: absolute;
            top: 100px;
            left: 20px;
            z-index: 20;
            transition: all 0.3s ease;
            opacity: 0;
            transform: scale(0.5);
        }
        
        #combo-container.active {
            opacity: 1;
            transform: scale(1);
        }

        .combo-bubble {
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1.5rem;
            font-weight: 800;
            color: #e65100;
            background: rgba(255, 213, 79, 0.7);
        }

        /* Game Area */
        #game-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            overflow: hidden;
        }

        /* Fruit Bubble */
        .fruit-bubble {
            position: absolute;
            width: clamp(120px, 15vw, 160px);
            height: clamp(120px, 15vw, 160px);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .fruit-emoji {
            font-size: clamp(3.5rem, 5vw, 5rem);
            line-height: 1;
            margin-bottom: 5px;
            pointer-events: none;
        }

        .fruit-name {
            font-size: clamp(1.2rem, 2vw, 1.6rem);
            font-weight: 800;
            color: #000;
            text-shadow: 1px 1px 2px #fff, -1px -1px 2px #fff, 1px -1px 2px #fff, -1px 1px 2px #fff;
            pointer-events: none;
            background: rgba(255,255,255,0.5);
            padding: 2px 10px;
            border-radius: 15px;
        }

        /* Effects */
        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            background: rgba(255, 107, 107, 0.4) !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .floating-text {
            position: absolute;
            font-size: 2.5rem;
            font-weight: 800;
            pointer-events: none;
            z-index: 30;
            animation: floatUpFade 1s ease-out forwards;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.9);
        }

        .text-correct { color: #2e7d32; }
        .text-wrong { color: #c62828; }

        @keyframes floatUpFade {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }

        /* Particle system for pop */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255,255,255,0.9);
            pointer-events: none;
            z-index: 15;
        }

        /* Stats in Game Over */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: rgba(255,255,255,0.4);
            padding: 15px;
            border-radius: 20px;
        }

        .stat-label { font-size: 1.4rem; font-weight: 600;}
        .stat-val { font-size: 2rem; font-weight: 800; color: #1565c0;}
        .final-score { grid-column: span 2; background: rgba(255,213,79,0.5); }
        .final-score .stat-val { font-size: 3.5rem; color: #d32f2f; }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            #game-hud {
                flex-wrap: wrap;
                top: 10px;
            }
            .hud-item {
                padding: 10px 15px;
                min-width: 100px;
            }
            .hud-value { font-size: 1.8rem; }
            #mission-hud {
                order: 3;
                width: 100%;
                margin-top: 10px;
            }
            #combo-container { top: 160px; }
            .stats-grid { grid-template-columns: 1fr; }
            .final-score { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="ambient-bubbles" id="ambient-bubbles"></div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <div class="glass-bubble modal-bubble">
            <h1>🍎 สวนผลไม้ภาษาไทย 🍎</h1>
            <p class="subtitle">เกมเก็บผลไม้แสนสนุก ฝึกอ่านและจำคำศัพท์</p>
            <button class="glass-bubble btn" onclick="startGame()">▶ เริ่มเกม</button>
        </div>
    </div>

    <!-- Game HUD -->
    <div id="game-hud" class="hidden">
        <div class="glass-bubble hud-item">
            <div class="hud-label">🏆 คะแนน</div>
            <div class="hud-value" id="score-display">0</div>
        </div>
        <div class="glass-bubble hud-item" id="mission-hud">
            <div class="hud-label">🎯 ภารกิจ</div>
            <div class="hud-value" id="mission-text">กำลังโหลด...</div>
        </div>
        <div class="glass-bubble hud-item">
            <div class="hud-label">⏱️ เวลา</div>
            <div class="hud-value" id="time-display">03:00</div>
        </div>
    </div>

    <div id="combo-container">
        <div class="glass-bubble combo-bubble" id="combo-text">Combo x2!</div>
    </div>

    <!-- Game Area -->
    <div id="game-area" class="hidden"></div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen hidden">
        <div class="glass-bubble modal-bubble">
            <h1>🎉 หมดเวลาแล้ว! 🎉</h1>
            
            <div class="stats-grid">
                <div class="stat-box final-score">
                    <div class="stat-label">🏆 คะแนนรวม</div>
                    <div class="stat-val" id="final-score">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">🍎 เก็บสำเร็จ</div>
                    <div class="stat-val" id="final-correct">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">❌ ตอบผิด</div>
                    <div class="stat-val" id="final-wrong">0</div>
                </div>
                <div class="stat-box" style="grid-column: 1 / -1;">
                    <div class="stat-label">🔥 Combo สูงสุด</div>
                    <div class="stat-val" id="final-combo">x0</div>
                </div>
            </div>

            <button class="glass-bubble btn" onclick="startGame()">🔄 เล่นอีกครั้ง</button>
            <button class="glass-bubble btn" onclick="showStartScreen()">🏠 กลับหน้าแรก</button>
        </div>
    </div>

    <script>
        // --- Database ---
        const fruitData = [
            { name: 'แอปเปิล', emoji: '🍎' }, { name: 'กล้วย', emoji: '🍌' },
            { name: 'ส้ม', emoji: '🍊' }, { name: 'แตงโม', emoji: '🍉' },
            { name: 'สับปะรด', emoji: '🍍' }, { name: 'มะม่วง', emoji: '🥭' },
            { name: 'องุ่น', emoji: '🍇' }, { name: 'สตรอว์เบอร์รี', emoji: '🍓' },
            { name: 'ลูกแพร์', emoji: '🍐' }, { name: 'ลูกพีช', emoji: '🍑' },
            { name: 'เชอร์รี', emoji: '🍒' }, { name: 'กีวี', emoji: '🥝' },
            { name: 'มะพร้าว', emoji: '🥥' }, { name: 'มะละกอ', emoji: '🍈' }, /* ใช้ melon แทน */
            { name: 'เมลอน', emoji: '🍈' }, { name: 'มะนาว', emoji: '🍋' }, 
            { name: 'ฝรั่ง', emoji: '🍏' }, /* ใช้แอปเปิลเขียวแทน */
            { name: 'เงาะ', emoji: '🍒' }, /* ใช้เชอร์รี่ประยุกต์ */
            { name: 'มังคุด', emoji: '🧄' } /* ประยุกต์ */
        ];

        // เพื่อความสวยงามและชัดเจน เราจะกรองใช้เฉพาะผลไม้ที่มี Emoji ชัดเจนสำหรับผู้สูงอายุ (เอาบลูเบอร์รีออก)
        const activeFruits = [
            { name: 'แอปเปิล', emoji: '🍎' }, { name: 'กล้วย', emoji: '🍌' },
            { name: 'ส้ม', emoji: '🍊' }, { name: 'แตงโม', emoji: '🍉' },
            { name: 'สับปะรด', emoji: '🍍' }, { name: 'มะม่วง', emoji: '🥭' },
            { name: 'องุ่น', emoji: '🍇' }, { name: 'สตรอว์เบอร์รี', emoji: '🍓' },
            { name: 'ลูกแพร์', emoji: '🍐' }, { name: 'ลูกพีช', emoji: '🍑' },
            { name: 'เชอร์รี', emoji: '🍒' }, { name: 'กีวี', emoji: '🥝' },
            { name: 'มะพร้าว', emoji: '🥥' }, { name: 'เมลอน', emoji: '🍈' },
            { name: 'มะนาว', emoji: '🍋' }
        ];

        // --- Audio System ---
        let isAudioInitialized = false;
        let bgmSequence;

        async function initAudio() {
            if (isAudioInitialized) return;
            await Tone.start();
            isAudioInitialized = true;

            // เอฟเฟคเสียงป๊อป
            window.sfxPop = new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 2, oscillator: { type: 'sine' } }).toDestination();
            window.sfxPop.volume.value = -10;

            // เอฟเฟคตอบถูก
            window.sfxCorrect = new Tone.PolySynth(Tone.Synth, { oscillator: { type: 'triangle' } }).toDestination();
            window.sfxCorrect.volume.value = -8;

            // เอฟเฟคตอบผิด
            window.sfxWrong = new Tone.Synth({ oscillator: { type: 'sawtooth' }, envelope: { attack: 0.05, decay: 0.2, sustain: 0.1, release: 0.5 } }).toDestination();
            window.sfxWrong.volume.value = -15;

            // เพลงประกอบฉาก (BGM)
            window.bgmSynth = new Tone.PolySynth(Tone.Synth, { 
                oscillator: { type: 'sine' }, 
                envelope: { attack: 0.1, decay: 0.2, sustain: 0.3, release: 1 } 
            }).toDestination();
            window.bgmSynth.volume.value = -22;

            const melody = [
                { time: '0:0:0', note: 'C4', duration: '8n' },
                { time: '0:0:2', note: 'E4', duration: '8n' },
                { time: '0:1:0', note: 'G4', duration: '8n' },
                { time: '0:1:2', note: 'E4', duration: '8n' },
                { time: '0:2:0', note: 'F4', duration: '8n' },
                { time: '0:2:2', note: 'A4', duration: '8n' },
                { time: '0:3:0', note: 'G4', duration: '4n' },
            ];

            bgmSequence = new Tone.Part((time, value) => {
                window.bgmSynth.triggerAttackRelease(value.note, value.duration, time);
            }, melody);
            bgmSequence.loop = true;
            bgmSequence.loopEnd = '1m';
            Tone.Transport.bpm.value = 90; // จังหวะสบายๆ
        }

        function playPop() { if(window.sfxPop) window.sfxPop.triggerAttackRelease("C4", "32n"); }
        function playCorrect() { if(window.sfxCorrect) window.sfxCorrect.triggerAttackRelease(["C5", "E5", "G5"], "8n"); }
        function playWrong() { if(window.sfxWrong) window.sfxWrong.triggerAttackRelease("C3", "8n"); }
        function startBGM() {
            if(bgmSequence) {
                Tone.Transport.start();
                bgmSequence.start(0);
            }
        }
        function stopBGM() {
            if(bgmSequence) {
                Tone.Transport.stop();
                bgmSequence.stop();
            }
        }

        // --- Game State ---
        let state = {
            isPlaying: false,
            score: 0,
            timeLeft: 180,
            combo: 0,
            maxCombo: 0,
            correctCount: 0,
            wrongCount: 0,
            currentMission: null,
            timerInterval: null,
            animationFrame: null,
            bubbles: [] // Store active fruit bubbles
        };

        // --- DOM Elements ---
        const UI = {
            startScreen: document.getElementById('start-screen'),
            gameHud: document.getElementById('game-hud'),
            gameArea: document.getElementById('game-area'),
            gameOverScreen: document.getElementById('game-over-screen'),
            scoreDisplay: document.getElementById('score-display'),
            missionText: document.getElementById('mission-text'),
            timeDisplay: document.getElementById('time-display'),
            comboContainer: document.getElementById('combo-container'),
            comboText: document.getElementById('combo-text')
        };

        // --- Background Setup ---
        function initAmbientBubbles() {
            const container = document.getElementById('ambient-bubbles');
            container.innerHTML = '';
            for(let i=0; i<15; i++) {
                let bubble = document.createElement('div');
                bubble.className = 'bg-bubble';
                let size = Math.random() * 60 + 20;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.animationDuration = `${Math.random() * 10 + 10}s`;
                bubble.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(bubble);
            }
        }
        initAmbientBubbles();

        // --- Screen Navigation ---
        function showStartScreen() {
            UI.startScreen.classList.remove('hidden');
            UI.gameHud.classList.add('hidden');
            UI.gameArea.classList.add('hidden');
            UI.gameOverScreen.classList.add('hidden');
        }

        // --- Main Game Logic ---
        async function startGame() {
            // เริ่มต้นระบบเสียงเมื่อผู้เล่นกดปุ่ม
            await initAudio();
            startBGM();

            // Reset state
            state = {
                isPlaying: true,
                score: 0,
                timeLeft: 180, // 3 minutes
                combo: 0,
                maxCombo: 0,
                correctCount: 0,
                wrongCount: 0,
                currentMission: null,
                timerInterval: null,
                animationFrame: null,
                bubbles: []
            };

            UI.gameArea.innerHTML = ''; // Clear board
            UI.scoreDisplay.innerText = state.score;
            UI.timeDisplay.innerText = formatTime(state.timeLeft);
            UI.timeDisplay.classList.remove('time-warning');
            updateComboUI();

            // Switch UI
            UI.startScreen.classList.add('hidden');
            UI.gameOverScreen.classList.add('hidden');
            UI.gameHud.classList.remove('hidden');
            UI.gameArea.classList.remove('hidden');

            generateMission();
            
            // Start Timer
            state.timerInterval = setInterval(updateTimer, 1000);
            
            // Start Spawning & Loop
            lastSpawnTime = 0;
            gameLoop();
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimer() {
            state.timeLeft--;
            UI.timeDisplay.innerText = formatTime(state.timeLeft);
            
            if(state.timeLeft <= 30) {
                UI.timeDisplay.classList.add('time-warning');
            }

            if(state.timeLeft <= 0) {
                endGame();
            }
        }

        function endGame() {
            state.isPlaying = false;
            clearInterval(state.timerInterval);
            cancelAnimationFrame(state.animationFrame);
            stopBGM(); // ปิดเพลงตอนจบ

            // Populate Game Over Stats
            document.getElementById('final-score').innerText = state.score;
            document.getElementById('final-correct').innerText = state.correctCount;
            document.getElementById('final-wrong').innerText = state.wrongCount;
            document.getElementById('final-combo').innerText = `x${state.maxCombo}`;

            // Show UI
            UI.gameHud.classList.add('hidden');
            UI.gameArea.classList.add('hidden');
            UI.gameOverScreen.classList.remove('hidden');
        }

        // --- Missions ---
        function generateMission() {
            // สุ่มผลไม้ 1 ชนิดจากรายการที่ใช้เล่นเพื่อนำมาเป็นคำถาม
            const targetFruit = activeFruits[Math.floor(Math.random() * activeFruits.length)];
            
            state.currentMission = {
                text: `❓ จงหา "${targetFruit.name}"`,
                check: (fruitName) => fruitName === targetFruit.name
            };

            UI.missionText.innerText = state.currentMission.text;
        }

        // --- Spawning & Mechanics ---
        let lastSpawnTime = 0;
        const spawnRate = 1500; // ms ช้าลงเพื่อให้ลอยขึ้นไม่เยอะจนตาลาย

        function createFruitBubble() {
            const el = document.createElement('div');
            el.className = 'glass-bubble fruit-bubble';
            
            // สุ่มผลไม้ 
            // โอกาส 40% ที่จะสุ่มให้ตรงกับคำถาม เพื่อให้เล่นได้ง่ายขึ้น
            let fruitInfo;
            if(Math.random() < 0.4 && state.currentMission) {
                let validFruits = activeFruits.filter(f => state.currentMission.check(f.name));
                if(validFruits.length > 0) {
                    fruitInfo = validFruits[0];
                } else {
                    fruitInfo = activeFruits[Math.floor(Math.random() * activeFruits.length)];
                }
            } else {
                fruitInfo = activeFruits[Math.floor(Math.random() * activeFruits.length)];
            }

            el.innerHTML = `
                <div class="fruit-emoji">${fruitInfo.emoji}</div>
                <div class="fruit-name">${fruitInfo.name}</div>
            `;

            // Position at bottom
            const size = window.innerWidth > 768 ? 160 : 120;
            let startX = Math.random() * (window.innerWidth - size);
            
            // Physics variables stored on element
            el._x = startX;
            el._y = window.innerHeight + 50; // Start below screen
            el._speed = Math.random() * 0.8 + 0.5; // ลอยขึ้นช้าๆ (0.5 ถึง 1.3)
            el._fruitName = fruitInfo.name;

            el.style.left = `${el._x}px`;
            el.style.top = `${el._y}px`;
            el.style.transform = 'none';

            // Interaction
            el.addEventListener('mousedown', (e) => handleInteract(e, el));
            el.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Prevent double firing
                handleInteract(e.touches[0], el);
            }, {passive: false});

            UI.gameArea.appendChild(el);
            state.bubbles.push(el);
        }

        function handleInteract(e, bubbleEl) {
            if(!state.isPlaying) return;
            if(bubbleEl.classList.contains('popping')) return;

            playPop(); // เล่นเสียงกดฟองน้ำ

            const isCorrect = state.currentMission.check(bubbleEl._fruitName);
            
            if(isCorrect) {
                // Correct!
                playCorrect(); // เล่นเสียงตอบถูก
                
                state.combo++;
                if(state.combo > state.maxCombo) state.maxCombo = state.combo;
                state.correctCount++;
                
                let points = 10;
                let comboMult = 1;
                if(state.combo >= 5) comboMult = 5;
                else if(state.combo >= 2) comboMult = state.combo;
                points = points * comboMult;
                
                updateScore(points);
                updateComboUI();
                
                showFloatingText(`เก่งมาก! +${points}`, bubbleEl._x, bubbleEl._y, 'text-correct');
                createPopEffect(bubbleEl._x + bubbleEl.offsetWidth/2, bubbleEl._y + bubbleEl.offsetHeight/2);
                
                // Remove bubble immediately
                bubbleEl.classList.add('popping');
                bubbleEl.remove();
                state.bubbles = state.bubbles.filter(b => b !== bubbleEl);
                
                // Change mission after few correct answers
                if(state.correctCount % 3 === 0) {
                    generateMission();
                }

            } else {
                // Wrong!
                playWrong(); // เล่นเสียงตอบผิด

                state.combo = 0;
                state.wrongCount++;
                updateComboUI();
                updateScore(-5);
                
                showFloatingText('ลองใหม่', bubbleEl._x, bubbleEl._y, 'text-wrong');
                
                // Shake effect
                bubbleEl.classList.add('shake');
                setTimeout(() => {
                    if(bubbleEl) bubbleEl.classList.remove('shake');
                }, 400);
            }
        }

        function updateScore(diff) {
            state.score += diff;
            if(state.score < 0) state.score = 0;
            UI.scoreDisplay.innerText = state.score;
            
            // Visual feedback on score
            UI.scoreDisplay.style.transform = 'scale(1.5)';
            UI.scoreDisplay.style.color = diff > 0 ? '#2e7d32' : '#c62828';
            setTimeout(() => {
                UI.scoreDisplay.style.transform = 'scale(1)';
                UI.scoreDisplay.style.color = 'inherit';
            }, 300);
        }

        function updateComboUI() {
            if(state.combo >= 2) {
                let mult = state.combo > 5 ? 5 : state.combo;
                UI.comboText.innerText = `Combo x${mult}!`;
                UI.comboContainer.classList.add('active');
                
                // Small bounce
                UI.comboText.style.transform = 'scale(1.2)';
                setTimeout(() => { UI.comboText.style.transform = 'scale(1)'; }, 200);
            } else {
                UI.comboContainer.classList.remove('active');
            }
        }

        // --- Visual Effects ---
        function showFloatingText(text, x, y, className) {
            const el = document.createElement('div');
            el.className = `floating-text ${className}`;
            el.innerText = text;
            // Center text on click location
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            UI.gameArea.appendChild(el);
            
            setTimeout(() => el.remove(), 1000);
        }

        function createPopEffect(x, y) {
            const particleCount = 8;
            for(let i=0; i<particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 15 + 5;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                
                UI.gameArea.appendChild(p);
                
                const angle = (Math.PI * 2 / particleCount) * i;
                const velocity = Math.random() * 50 + 50;
                const tx = Math.cos(angle) * velocity;
                const ty = Math.sin(angle) * velocity;
                
                p.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: 600,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                }).onfinish = () => p.remove();
            }
        }

        // --- Game Loop ---
        function gameLoop(timestamp) {
            if(!state.isPlaying) return;

            // Spawning
            if(timestamp - lastSpawnTime > spawnRate) {
                // Adjust max bubbles based on screen size
                const maxBubbles = window.innerWidth > 768 ? 10 : 6;
                if(state.bubbles.length < maxBubbles) {
                    createFruitBubble();
                }
                lastSpawnTime = timestamp;
            }

            // Movement update
            for(let i = state.bubbles.length - 1; i >= 0; i--) {
                let b = state.bubbles[i];
                
                // Move up slowly ลอยขึ้นตรงๆ อย่างเดียว
                b._y -= b._speed;
                b.style.top = `${b._y}px`;

                // Remove if out of screen top
                if(b._y < -200) {
                    b.remove();
                    state.bubbles.splice(i, 1);
                }
            }

            state.animationFrame = requestAnimationFrame(gameLoop);
        }

    </script>
</body>
</html>
