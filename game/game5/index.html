<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมล่าคำไทย (Thai Word Hunter) - Cloud & AR Theme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&family=Mitr:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- MediaPipe สำหรับระบบ AR Tracking มือ -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #38BDF8 0%, #BAE6FD 100%);
            touch-action: none;
            user-select: none;
            transition: background 0.5s;
        }

        body.ar-active {
            background: transparent;
        }
        body.ar-active .bg-cloud {
            display: none;
        }
        body.ar-active .top-section {
            background: linear-gradient(to bottom, rgba(255,255,255, 0.8), transparent);
        }
        body.ar-active .bottom-section {
            background: linear-gradient(to top, rgba(255,255,255, 0.9) 0%, transparent 100%);
        }

        #webcam-video {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #webcam-video.active {
            opacity: 1;
        }

        h1, h2, h3, .heading-font {
            font-family: 'Mitr', sans-serif;
        }

        .cloud-panel {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1), inset 0 -4px 0 rgba(200,200,200,0.3);
            color: #0369A1;
            position: relative;
            z-index: 10;
            border: 3px solid #E0F2FE;
            margin-top: 25px; /* เผื่อพื้นที่ให้หัวเมฆด้านบน */
        }
        
        /* สร้างก้อนเมฆนูนๆ ด้านบน */
        .cloud-panel::before {
            content: ''; position: absolute;
            width: 80px; height: 80px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            top: -35px; left: 15%;
            z-index: -1;
        }
        .cloud-panel::after {
            content: ''; position: absolute;
            width: 110px; height: 110px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            top: -45px; right: 15%;
            z-index: -1;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* UI Layer จะอยู่หลัง AR World เพื่อให้ฟองสบู่บังโจทย์ได้ (ตามที่ต้องการคือห้ามไปอยู่หลังโจทย์) */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
        }

        .top-section {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: auto;
            background: linear-gradient(to bottom, rgba(56, 189, 248, 0.9), transparent);
            transition: background 0.5s;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            padding: 0 1rem;
        }

        .stat-box {
            background: white;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-weight: 800;
            font-size: 1.1rem;
            color: #0284C7;
            border: 3px solid #7DD3FC;
            box-shadow: 0 4px 0 #38BDF8;
            display: flex; align-items: center; gap: 0.5rem;
        }

        .question-box {
            padding: 1rem 1.5rem;
            text-align: center;
            max-width: 500px;
            margin-left: auto; margin-right: auto;
            width: 90%;
            font-size: 1.1rem;
            font-weight: 600;
        }

        #play-area {
            flex: 1;
            pointer-events: none;
            width: 100%;
            position: relative;
        }

        .bottom-section {
            padding: 1rem 1rem 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            pointer-events: auto;
            background: linear-gradient(to top, rgba(186, 230, 253, 0.95) 0%, transparent 100%);
            transition: all 0.3s;
            border-top: 3px dashed transparent;
            min-height: 120px;
        }
        
        body.dragging .bottom-section {
            border-top: 3px dashed #0284C7;
            background: linear-gradient(to top, rgba(125, 211, 252, 0.95) 0%, rgba(224, 242, 254, 0.4) 100%);
            box-shadow: inset 0 -20px 40px rgba(56, 189, 248, 0.2);
        }

        #target-word-display {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .word-slot {
            width: 45px;
            height: 55px;
            background: white;
            border: 3px solid #38BDF8;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            color: #0369A1;
            box-shadow: 0 4px 0 #0284C7;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @media (min-width: 768px) {
            .word-slot { width: 60px; height: 70px; font-size: 2.2rem; gap: 0.8rem; }
            .stat-box { font-size: 1.3rem; padding: 0.5rem 1.5rem; }
        }

        .word-slot.empty {
            background: rgba(255,255,255,0.6);
            border: 3px dashed #7DD3FC;
            color: transparent;
            box-shadow: none;
        }
        
        .word-slot.filled-anim {
            transform: scale(1.1);
            background: #BAE6FD;
            border-color: #0284C7;
        }

        #ar-world {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* ตัวคอนเทนเนอร์ทะลุผ่านได้ */
            z-index: 40; /* อยู่หน้า UI ทำให้เวลาลากฟองจะไม่มุดหลังโจทย์ */
        }

        .floating-letter {
            position: absolute;
            width: 70px; height: 70px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), rgba(200, 240, 255, 0.8) 40%, rgba(200, 220, 255, 0.6) 80%);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            color: #0284C7;
            text-shadow: 0px 2px 4px rgba(255,255,255,0.8);
            box-shadow: 
                inset 0 0 15px rgba(255, 255, 255, 0.8),
                inset 8px 0 15px rgba(255, 255, 255, 0.5),
                inset -8px -8px 15px rgba(100, 200, 255, 0.4),
                0 6px 12px rgba(0,0,0,0.15);
            cursor: pointer;
            animation: floatBubble 4s ease-in-out infinite;
            backdrop-filter: blur(4px);
            touch-action: none;
            pointer-events: auto; /* ให้ตัวฟองสบู่จับได้ */
        }

        @media (min-width: 768px) {
            .floating-letter { width: 85px; height: 85px; font-size: 2.6rem; }
        }

        .floating-letter.grabbed {
            animation: none !important;
            transform: scale(1.15);
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
            z-index: 1000 !important;
        }

        .floating-letter::after {
            content: ''; position: absolute;
            top: 10%; left: 15%; width: 25%; height: 25%;
            background: white; border-radius: 50%;
            opacity: 0.9; filter: blur(1px);
        }
        
        .floating-letter::before {
            content: ''; position: absolute;
            bottom: 12%; right: 15%; width: 40%; height: 15%;
            background: white; border-radius: 50%;
            opacity: 0.4; transform: rotate(-45deg); filter: blur(2px);
        }

        @keyframes floatBubble {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); }
            33% { transform: translateY(-12px) translateX(8px) scale(1.02); }
            66% { transform: translateY(-6px) translateX(-8px) scale(0.98); }
        }

        .popping {
            animation: popOut 0.2s forwards !important;
            pointer-events: none;
        }

        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        .bg-cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.6;
            animation: moveClouds linear infinite;
            z-index: 0;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
        }
        .bg-cloud::before, .bg-cloud::after {
            content: ''; position: absolute; background: white; border-radius: 50%;
        }
        .bg-cloud1 { width: 120px; height: 40px; top: 20%; left: -150px; animation-duration: 40s; }
        .bg-cloud1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .bg-cloud1::after { width: 50px; height: 50px; top: -15px; left: 60px; }
        
        .bg-cloud2 { width: 160px; height: 50px; top: 40%; left: -200px; animation-duration: 55s; animation-delay: -20s; opacity: 0.4; transform: scale(0.8); }
        .bg-cloud2::before { width: 80px; height: 80px; top: -40px; left: 25px; }
        .bg-cloud2::after { width: 60px; height: 60px; top: -20px; left: 80px; }

        @keyframes moveClouds {
            from { transform: translateX(0); }
            to { transform: translateX(120vw); }
        }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(14, 165, 233, 0.6);
            backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50; text-align: center;
        }

        .hidden { display: none !important; }

        .btn-cloud {
            background: #38BDF8;
            color: white;
            font-family: 'Mitr', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            padding: 0.8rem 2rem;
            border-radius: 9999px;
            border: 4px solid #0284C7;
            cursor: pointer;
            box-shadow: 0 6px 0 #0284C7;
            transition: all 0.1s;
            margin-top: 1.2rem;
            width: 100%;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        .btn-cloud:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #0284C7;
        }
        
        .btn-cloud:disabled {
            background: #9CA3AF;
            border-color: #4B5563;
            box-shadow: 0 6px 0 #4B5563;
            cursor: not-allowed;
        }

        #confetti-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 45;
        }

        /* เป้าชี้ตำแหน่งมือ AR */
        #hand-cursor {
            position: absolute;
            width: 30px; height: 30px;
            background: rgba(56, 189, 248, 0.7);
            border: 3px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10000;
            display: none; 
            transition: transform 0.1s ease-out, background 0.1s ease-out;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        #hand-cursor.pinching {
            transform: translate(-50%, -50%) scale(0.7);
            background: rgba(16, 185, 129, 0.9); /* เปลี่ยนเป็นสีเขียวเมื่อจีบ */
            border-color: #A7F3D0;
        }

    </style>
</head>
<body>
    <video id="webcam-video" autoplay playsinline></video>
    <div id="hand-cursor"></div>

    <div id="game-container">
        <!-- เมฆประดับพื้นหลัง -->
        <div class="bg-cloud bg-cloud1"></div>
        <div class="bg-cloud bg-cloud2"></div>

        <!-- โลกของฟองสบู่ (Z-index สูงกว่า UI โจทย์ เพื่อไม่ให้หลบหลังโจทย์) -->
        <div id="ar-world"></div>
        <canvas id="confetti-canvas"></canvas>

        <!-- UI Layer (โจทย์และกล่องคำตอบ) -->
        <div id="ui-layer">
            <div class="top-section">
                <div class="stats-bar">
                    <div class="stat-box">⭐ <span id="score">0</span></div>
                    <div class="stat-box">⏱️ <span id="timer">60</span>s</div>
                </div>
                <!-- กล่องโจทย์เปลี่ยนเป็นเมฆ -->
                <div class="cloud-panel question-box">
                    <div class="heading-font text-sky-600 text-sm md:text-base mb-1">คำใบ้:</div>
                    <div id="word-hint" class="text-xl md:text-2xl text-sky-900 font-bold">หาตัวอักษรมาเติมให้เต็ม</div>
                </div>
            </div>

            <div id="play-area"></div>

            <div class="bottom-section">
                <div class="text-sm font-bold text-sky-700 mb-1">👇 ลากฟองสบู่มาใส่ที่นี่ 👇</div>
                <div id="target-word-display" class="heading-font"></div>
            </div>
        </div>

        <!-- หน้าต่างเริ่มเกม (เมฆ) -->
        <div id="start-screen" class="overlay-screen">
            <div class="cloud-panel p-6 md:p-8 max-w-sm mx-4 w-11/12 mt-10">
                <h1 class="text-4xl md:text-5xl heading-font text-sky-500 mb-4 tracking-wide" style="text-shadow: 2px 2px 0px white;">เกมล่าคำไทย</h1>
                <div class="text-sm md:text-base font-semibold text-sky-800 text-left bg-sky-50 p-4 rounded-2xl border border-sky-100">
                    <p class="mb-2">📸 <strong>ระบบ AR:</strong> จีบนิ้วค้างที่ฟองสบู่ แล้วลากลงมาใส่กล่องด้านล่าง</p>
                    <p>📱 <strong>มือถือ/PC:</strong> แตะค้างที่ฟองสบู่ แล้วลากลงมาใส่กล่องด้านล่าง</p>
                </div>
                <button id="start-btn" class="btn-cloud mt-6">เริ่มโหมดกล้อง AR!</button>
                <button id="start-normal-btn" class="btn-cloud !mt-3 !text-sm !py-3" style="background:#fff; color:#0284C7; border-color:#7DD3FC; box-shadow: 0 6px 0 #7DD3FC;">เล่นโหมดปกติ (จอสัมผัส)</button>
            </div>
        </div>

        <!-- หน้าต่างจบเกม (เมฆ) -->
        <div id="game-over-screen" class="overlay-screen hidden">
            <div class="cloud-panel p-8 max-w-sm mx-4 w-11/12 mt-10">
                <h1 class="text-4xl md:text-5xl heading-font text-sky-500 mb-2">หมดเวลา!</h1>
                <p class="text-lg md:text-xl font-bold text-sky-800">คะแนนของคุณ</p>
                <p class="text-7xl font-black text-amber-500 my-4 heading-font" style="text-shadow: 3px 3px 0 white;" id="final-score">0</p>
                <button id="restart-btn" class="btn-cloud" style="font-size: 1.5rem;">เล่นอีกครั้ง</button>
            </div>
        </div>
    </div>

    <script>
        const vocabulary = [
            { word: "สวัสดี", hint: "คำทักทายของคนไทยเมื่อพบกัน" },
            { word: "ขอบคุณ", hint: "คำกล่าวแสดงความรู้สึกซาบซึ้ง" },
            { word: "อาหาร", hint: "สิ่งที่เรากินเพื่อดำรงชีวิต" },
            { word: "ครอบครัว", hint: "กลุ่มคนที่มีความสัมพันธ์กันทางสายเลือด" },
            { word: "ความสุข", hint: "ความรู้สึกดีใจ อิ่มเอมใจ" },
            { word: "โรงเรียน", hint: "สถานที่สำหรับศึกษาเล่าเรียน" },
            { word: "ฟองสบู่", hint: "ลูกกลมๆ ใสๆ ที่ลอยอยู่ในอากาศ" },
            { word: "ก้อนเมฆ", hint: "ละอองน้ำที่รวมตัวกันลอยอยู่บนฟ้า" },
            { word: "น่ารัก", hint: "ดูดี ถูกใจ น่าเอ็นดู" },
            { word: "รอยยิ้ม", hint: "อาการที่แสดงความสุขบนใบหน้า" }
        ];

        const thaiConsonants = "กขคงจฉชซญดตถทธนบปผฝพฟภมยรลวศษสหอ";
        const thaiVowels = "ะาิีึืุูเแโใไ"; 

        let currentWordObj = null;
        let wordSlots = []; 
        let score = 0;
        let timeLeft = 60;
        let gameInterval;
        let isPlaying = false;
        let arModeActive = false;
        
        let bubblePositions = []; 

        // AR & Gesture State
        let isPinching = false;
        let grabbedElement = null;

        const arWorld = document.getElementById('ar-world');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const targetWordDisplay = document.getElementById('target-word-display');
        const hintDisplay = document.getElementById('word-hint');
        
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        
        const startBtn = document.getElementById('start-btn');
        const startNormalBtn = document.getElementById('start-normal-btn');
        const restartBtn = document.getElementById('restart-btn');
        const videoElement = document.getElementById('webcam-video');
        const handCursor = document.getElementById('hand-cursor');

        function initGame() {
            startBtn.addEventListener('click', () => startARGame());
            startNormalBtn.addEventListener('click', () => startGame(false));
            restartBtn.addEventListener('click', () => startGame(arModeActive));
        }

        async function startARGame() {
            startBtn.textContent = 'กำลังเตรียมกล้อง...';
            startBtn.disabled = true;
            startNormalBtn.style.display = 'none';

            try {
                const hands = new Hands({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }});
                
                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.65,
                    minTrackingConfidence: 0.65
                });
                
                hands.onResults(onARResults);

                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({image: videoElement});
                    },
                    width: 640,
                    height: 480
                });
                
                await camera.start();
                startGame(true);
            } catch (error) {
                console.error("Camera Error:", error);
                alert("ไม่สามารถเปิดกล้องได้ จะเปลี่ยนเป็นโหมดปกติแทนครับ");
                startGame(false);
            }
        }

        function onARResults(results) {
            if (!isPlaying) return;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                const screenW = window.innerWidth;
                const screenH = window.innerHeight;
                const handX = (1 - indexTip.x) * screenW;
                const handY = indexTip.y * screenH;

                handCursor.style.left = `${handX}px`;
                handCursor.style.top = `${handY}px`;
                handCursor.style.display = 'block';

                const dx = indexTip.x - thumbTip.x;
                const dy = indexTip.y - thumbTip.y;
                const dz = indexTip.z - thumbTip.z;
                const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);
                
                const pinchThreshold = 0.055;
                const currentlyPinching = distance < pinchThreshold;

                if (currentlyPinching && !isPinching) {
                    isPinching = true;
                    handCursor.classList.add('pinching');
                    handlePinchStart(handX, handY);
                } else if (!currentlyPinching && isPinching) {
                    isPinching = false;
                    handCursor.classList.remove('pinching');
                    handlePinchEnd();
                }

                if (isPinching && grabbedElement) {
                    const elWidth = grabbedElement.offsetWidth / 2;
                    grabbedElement.style.left = `${handX - elWidth}px`;
                    grabbedElement.style.top = `${handY - elWidth}px`;
                }
            } else {
                handCursor.style.display = 'none';
                if (isPinching) {
                    isPinching = false;
                    handCursor.classList.remove('pinching');
                    handlePinchEnd();
                }
            }
        }

        function handlePinchStart(x, y) {
            const elements = document.elementsFromPoint(x, y);
            const bubble = elements.find(el => el.classList.contains('floating-letter'));

            if (bubble) {
                grabbedElement = bubble;
                grabbedElement.classList.add('grabbed');
                document.body.classList.add('dragging');
                
                if(!grabbedElement.dataset.origX) {
                    grabbedElement.dataset.origX = grabbedElement.style.left;
                    grabbedElement.dataset.origY = grabbedElement.style.top;
                }
            }
        }

        function handlePinchEnd() {
            if (grabbedElement) {
                document.body.classList.remove('dragging');
                const rect = grabbedElement.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                checkDropTarget(grabbedElement.textContent, grabbedElement, centerX, centerY);
                
                grabbedElement.classList.remove('grabbed');
                grabbedElement = null;
            }
        }

        function startGame(useAR) {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            arModeActive = useAR;
            if (arModeActive) {
                document.body.classList.add('ar-active');
                videoElement.classList.add('active');
            } else {
                document.body.classList.remove('ar-active');
                videoElement.classList.remove('active');
            }
            
            score = 0;
            timeLeft = 60;
            isPlaying = true;
            updateScore();
            updateTimerDisplay();
            arWorld.innerHTML = '';
            
            startMusic();
            loadNextWord();
            
            gameInterval = setInterval(updateTimer, 1000);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            stopMusic();
            
            finalScoreDisplay.textContent = score;
            gameOverScreen.classList.remove('hidden');
            
            const letters = document.querySelectorAll('.floating-letter');
            letters.forEach(l => l.style.animationPlayState = 'paused');

            startBtn.textContent = 'เริ่มโหมดกล้อง AR อีกครั้ง';
            startBtn.disabled = false;
            startNormalBtn.style.display = 'block';
            handCursor.style.display = 'none';
        }

        function updateTimer() {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) endGame();
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = timeLeft;
            timerDisplay.style.color = timeLeft <= 10 ? '#EF4444' : '#0284C7';
        }

        function updateScore() {
            scoreDisplay.textContent = score;
        }

        function loadNextWord() {
            arWorld.innerHTML = ''; 
            bubblePositions = []; 
            
            const randomIndex = Math.floor(Math.random() * vocabulary.length);
            currentWordObj = vocabulary[randomIndex];
            const targetWord = Array.from(currentWordObj.word); 
            
            wordSlots = targetWord.map(char => ({ char: char, filled: false }));
            
            // ให้คำใบ้ฟรี 1 ช่องเสมอ (เพื่อให้เล่นง่ายขึ้นตามที่ขอ)
            if (wordSlots.length > 1) {
                const hintIndex = Math.floor(Math.random() * wordSlots.length);
                wordSlots[hintIndex].filled = true;
            }
            
            hintDisplay.textContent = currentWordObj.hint;
            renderTargetDisplay();
            
            wordSlots.forEach(slot => {
                if (!slot.filled) {
                    spawnSpecificLetter(slot.char);
                }
            });
            
            // สร้างตัวอักษรหลอก
            const extraBubblesCount = 6; // ลดจำนวนตัวหลอกลงหน่อยให้จอไม่รกเกินไป
            for(let i=0; i < extraBubblesCount; i++) {
                spawnSpecificLetter(getRandomThaiChar());
            }
        }

        function renderTargetDisplay() {
            let displayHtml = '';
            wordSlots.forEach(slot => {
                if (slot.filled) {
                    displayHtml += `<div class="word-slot">${slot.char}</div>`; 
                } else {
                    displayHtml += `<div class="word-slot empty">_</div>`; 
                }
            });
            targetWordDisplay.innerHTML = displayHtml;
        }

        function getRandomThaiChar() {
            const source = Math.random() > 0.3 ? thaiConsonants : thaiVowels;
            return source[Math.floor(Math.random() * source.length)];
        }

        function spawnSpecificLetter(char) {
            const letterEl = document.createElement('div');
            letterEl.className = 'floating-letter';
            letterEl.textContent = char;

            const isMobile = window.innerWidth < 768;
            const size = isMobile ? 70 : 85;
            const screenW = window.innerWidth;
            
            // คำนวณพื้นที่ว่าง เพื่อไม่ให้ฟองสบู่บังโจทย์ UI
            const topUI = document.querySelector('.top-section').getBoundingClientRect();
            const bottomUI = document.querySelector('.bottom-section').getBoundingClientRect();
            
            const minX = 10;
            const maxX = Math.max(minX, screenW - size - 10);
            
            // ตั้งค่าให้อยู่ต่ำกว่าก้อนเมฆโจทย์ และสูงกว่าช่องใส่คำตอบ
            const minY = topUI.bottom + 10; 
            const maxY = Math.max(minY, bottomUI.top - size - 20);

            let x, y;
            let validPosition = false;
            let attempts = 0;
            const minDistance = size + 10; // ระยะห่างขั้นต่ำไม่ให้ซ้อนกัน

            while (!validPosition && attempts < 100) {
                x = Math.random() * (maxX - minX) + minX;
                y = Math.random() * (maxY - minY) + minY;
                validPosition = true;
                
                // เช็คว่าไม่ทับตำแหน่งเดิม
                for (let pos of bubblePositions) {
                    const dx = x - pos.x;
                    const dy = y - pos.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < minDistance) {
                        validPosition = false;
                        break;
                    }
                }
                attempts++;
            }
            bubblePositions.push({ x, y });

            letterEl.style.left = `${x}px`;
            letterEl.style.top = `${y}px`;
            letterEl.dataset.origX = `${x}px`;
            letterEl.dataset.origY = `${y}px`;
            letterEl.style.animationDelay = `${Math.random() * 2}s`;
            
            let startX, startY;
            let initialLeft, initialTop;

            letterEl.addEventListener('pointerdown', (e) => {
                if(letterEl.classList.contains('popping') || arModeActive) return; 
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = parseFloat(letterEl.style.left) || x;
                initialTop = parseFloat(letterEl.style.top) || y;
                
                letterEl.dataset.origX = `${initialLeft}px`;
                letterEl.dataset.origY = `${initialTop}px`;
                
                letterEl.setPointerCapture(e.pointerId);
                letterEl.classList.add('grabbed');
                document.body.classList.add('dragging');
            });

            letterEl.addEventListener('pointermove', (e) => {
                if (!letterEl.hasPointerCapture(e.pointerId)) return;
                
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;
                
                let newX = initialLeft + dx;
                let newY = initialTop + dy;

                letterEl.style.left = `${newX}px`;
                letterEl.style.top = `${newY}px`;
            });

            letterEl.addEventListener('pointerup', (e) => {
                if(letterEl.classList.contains('popping') || arModeActive) return;
                letterEl.releasePointerCapture(e.pointerId);
                letterEl.classList.remove('grabbed');
                document.body.classList.remove('dragging');
                
                const rect = letterEl.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                checkDropTarget(char, letterEl, centerX, centerY);
            });

            arWorld.appendChild(letterEl);
        }

        function checkDropTarget(char, element, dropX, dropY) {
            const bottomSection = document.querySelector('.bottom-section');
            const bottomRect = bottomSection.getBoundingClientRect();
            
            const isInDropZone = (dropY >= bottomRect.top && dropY <= bottomRect.bottom && 
                                  dropX >= bottomRect.left && dropX <= bottomRect.right);

            if (isInDropZone) {
                const emptySlotIndex = wordSlots.findIndex(slot => !slot.filled && slot.char === char);
                
                if (emptySlotIndex !== -1) {
                    wordSlots[emptySlotIndex].filled = true;
                    
                    element.classList.add('popping');
                    setTimeout(() => {
                        if(element.parentNode === arWorld) arWorld.removeChild(element);
                    }, 200);

                    score += 10;
                    updateScore();
                    renderTargetDisplay();
                    
                    // เพิ่ม Animation ให้ช่องที่เพิ่งเติม
                    const slots = document.querySelectorAll('.word-slot');
                    if(slots[emptySlotIndex]) {
                        slots[emptySlotIndex].classList.add('filled-anim');
                        setTimeout(() => slots[emptySlotIndex].classList.remove('filled-anim'), 300);
                    }

                    playPopSound();
                    showFloatingText('+10', dropX, dropY - 50, '#0284C7');

                    if (wordSlots.every(slot => slot.filled)) {
                        wordComplete();
                    }
                } else {
                    showFloatingText('ผิด!', dropX, dropY - 50, '#EF4444');
                    snapBackToOriginal(element);
                }
            } else {
                snapBackToOriginal(element);
            }
        }
        
        function snapBackToOriginal(element) {
            element.style.transition = 'top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            element.style.left = element.dataset.origX;
            element.style.top = element.dataset.origY;
            
            setTimeout(() => {
                element.style.transition = '';
            }, 300);
        }

        function wordComplete() {
            score += 50; 
            updateScore();
            
            targetWordDisplay.style.transform = 'scale(1.15)';
            targetWordDisplay.style.transition = 'transform 0.2s';
            setTimeout(() => targetWordDisplay.style.transform = 'scale(1)', 300);
            
            playWinSound();
            fireConfetti();
            
            setTimeout(() => {
                loadNextWord();
            }, 1500);
        }

        function showFloatingText(text, x, y, color) {
            const floater = document.createElement('div');
            floater.textContent = text;
            floater.style.position = 'fixed';
            floater.style.left = `${Math.max(10, Math.min(x, window.innerWidth - 80))}px`;
            floater.style.top = `${Math.max(10, Math.min(y, window.innerHeight - 80))}px`;
            floater.style.color = color;
            floater.style.fontWeight = '900';
            floater.style.fontSize = '2.2rem';
            floater.style.textShadow = '2px 2px 0 white, -2px -2px 0 white, 2px -2px 0 white, -2px 2px 0 white';
            floater.style.pointerEvents = 'none';
            floater.style.zIndex = '10000';
            floater.style.transition = 'all 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
            
            document.body.appendChild(floater);
            
            setTimeout(() => {
                floater.style.transform = 'translateY(-60px) scale(1.2)';
                floater.style.opacity = '0';
            }, 20);
            
            setTimeout(() => {
                if(floater.parentNode) document.body.removeChild(floater);
            }, 800);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let musicPlaying = false;
        let musicTimer = null;

        function playNote(freq, duration, startTime, volume = 0.05, type="triangle") {
            if(audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(volume, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function playPopSound() {
            if (audioCtx.state === "suspended") audioCtx.resume();
            const now = audioCtx.currentTime;
            playNote(600, 0.1, now, 0.1, "sine");
            playNote(1000, 0.15, now + 0.02, 0.05, "sine");
        }
        
        function playWinSound() {
            if (audioCtx.state === "suspended") audioCtx.resume();
            const now = audioCtx.currentTime;
            playNote(523.25, 0.1, now, 0.1, "square");
            playNote(659.25, 0.1, now + 0.1, 0.1, "square");
            playNote(783.99, 0.3, now + 0.2, 0.1, "square");
        }

        function startMusic() {
            if (musicPlaying) return;
            musicPlaying = true;
            if (audioCtx.state === "suspended") audioCtx.resume();
            playMelody();
        }

        function playMelody() {
            if (!musicPlaying) return;
            const now = audioCtx.currentTime;
            const melody = [392.00, 523.25, 659.25, 523.25, 783.99, 659.25, 523.25, 392.00];
            melody.forEach((note, i) => {
                playNote(note, 0.3, now + i * 0.4, 0.02, "sine");
            });
            musicTimer = setTimeout(playMelody, 4000);
        }

        function stopMusic() {
            musicPlaying = false;
            if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
        }

        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const colors = ['#38BDF8', '#60A5FA', '#34D399', '#FDE047', '#FFFFFF'];
            
            for(let i=0; i<80; i++) {
                particles.push({
                    x: canvas.width / 2, y: canvas.height / 2 + 100,
                    vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 1) * 30 - 5,
                    size: Math.random() * 10 + 5, 
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 15
                });
            }
            
            let frame = 0;
            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let activeParticles = 0;
                
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 1;
                    p.rot += p.rotSpeed;
                    
                    if (p.y < canvas.height) {
                        activeParticles++;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rot * Math.PI / 180);
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(0, 0, p.size, 0, Math.PI * 2); 
                        ctx.fill();
                        ctx.restore();
                    }
                });
                
                frame++;
                if (activeParticles > 0 && frame < 150) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            animateConfetti();
        }

        window.onload = initGame;
    </script>
