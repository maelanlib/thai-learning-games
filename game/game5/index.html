<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมล่าคำไทย (Thai Word Hunter) - AR Sponge Theme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&family=Mitr:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- MediaPipe สำหรับระบบ AR Tracking มือ -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #38BDF8 0%, #BAE6FD 100%);
            touch-action: none;
            user-select: none;
            transition: background 0.5s;
        }

        /* เมื่อเปิดโหมด AR จะทำให้พื้นหลังโปร่งใสเพื่อเห็นกล้อง */
        body.ar-active {
            background: transparent;
        }
        body.ar-active .cloud {
            display: none;
        }
        body.ar-active .top-section {
            background: linear-gradient(to bottom, rgba(255,255,255, 0.8), transparent);
        }
        body.ar-active .bottom-section {
            background: linear-gradient(to top, rgba(255,255,255, 0.8) 0%, transparent 100%);
        }

        #webcam-video {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            object-fit: cover;
            transform: scaleX(-1); /* กลับซ้ายขวาให้เหมือนกระจก */
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #webcam-video.active {
            opacity: 1;
        }

        h1, h2, h3, .heading-font {
            font-family: 'Mitr', sans-serif;
        }

        .sponge-panel {
            background-color: #FDE047;
            border: 6px solid #B45309;
            border-radius: 20px;
            box-shadow: 0 8px 0 #92400E, 0 15px 25px rgba(0,0,0,0.25);
            color: #1E3A8A;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }
        
        .sponge-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(#B45309 10%, transparent 15%),
                radial-gradient(#B45309 12%, transparent 18%),
                radial-gradient(#B45309 8%, transparent 12%);
            background-size: 40px 40px, 30px 30px, 50px 50px;
            background-position: 0 0, 15px 15px, 25px 35px;
            opacity: 0.15;
            pointer-events: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
        }

        .top-section {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            pointer-events: auto;
            background: linear-gradient(to bottom, rgba(56, 189, 248, 0.9), transparent);
            transition: background 0.5s;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .stat-box {
            background: white;
            padding: 0.5rem 1.2rem;
            border-radius: 999px;
            font-weight: 800;
            font-size: 1.2rem;
            color: #2563EB;
            border: 4px solid #60A5FA;
            box-shadow: 0 4px 0 #3B82F6;
            display: flex; align-items: center; gap: 0.5rem;
        }

        .question-box {
            padding: 0.8rem 1.2rem;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            font-size: 1.1rem;
            font-weight: 600;
        }

        #play-area {
            flex: 1;
            pointer-events: none;
            width: 100%;
            position: relative;
        }

        .bottom-section {
            padding: 1rem 1rem 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            pointer-events: auto;
            background: linear-gradient(to top, rgba(186, 230, 253, 0.9) 0%, transparent 100%);
            transition: background 0.5s;
        }

        #target-word-display {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .word-slot {
            width: 50px;
            height: 60px;
            background: white;
            border: 4px solid #60A5FA;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: #047857;
            box-shadow: 0 4px 0 #3B82F6;
        }

        .word-slot.empty {
            background: rgba(255,255,255,0.7);
            border: 4px dashed #93C5FD;
            color: transparent;
            box-shadow: none;
        }

        #ar-world {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: auto;
            transition: transform 0.1s ease-out;
        }

        .floating-letter {
            position: absolute;
            width: 80px; height: 80px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95), rgba(200, 240, 255, 0.8) 40%, rgba(255, 200, 255, 0.6) 80%);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: #1E3A8A;
            text-shadow: 0px 2px 4px rgba(255,255,255,0.8);
            box-shadow: 
                inset 0 0 20px rgba(255, 255, 255, 0.8),
                inset 10px 0 20px rgba(255, 255, 255, 0.4),
                inset -10px -10px 20px rgba(100, 200, 255, 0.3),
                0 6px 12px rgba(0,0,0,0.15);
            cursor: pointer;
            animation: floatBubble 5s ease-in-out infinite;
            backdrop-filter: blur(4px);
            touch-action: none;
        }

        .floating-letter.grabbed {
            animation: none !important;
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            z-index: 1000 !important;
        }

        .floating-letter::after {
            content: '';
            position: absolute;
            top: 10%; left: 15%;
            width: 25%; height: 25%;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(1px);
        }
        
        .floating-letter::before {
            content: '';
            position: absolute;
            bottom: 10%; right: 15%;
            width: 40%; height: 15%;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            transform: rotate(-45deg);
            filter: blur(2px);
        }

        @keyframes floatBubble {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); }
            33% { transform: translateY(-15px) translateX(10px) scale(1.02); }
            66% { transform: translateY(-8px) translateX(-10px) scale(0.98); }
        }

        .popping {
            animation: popOut 0.2s forwards !important;
            pointer-events: none;
        }

        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.7;
            animation: moveClouds linear infinite;
            z-index: 0;
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
        }
        .cloud::before, .cloud::after {
            content: ''; position: absolute; background: white; border-radius: 50%;
        }
        .cloud1 { width: 120px; height: 40px; top: 15%; left: -150px; animation-duration: 35s; }
        .cloud1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .cloud1::after { width: 50px; height: 50px; top: -15px; left: 60px; }
        
        .cloud2 { width: 160px; height: 50px; top: 35%; left: -200px; animation-duration: 50s; animation-delay: -15s; opacity: 0.5; transform: scale(0.8); }
        .cloud2::before { width: 80px; height: 80px; top: -40px; left: 25px; }
        .cloud2::after { width: 60px; height: 60px; top: -20px; left: 80px; }

        @keyframes moveClouds {
            from { transform: translateX(0); }
            to { transform: translateX(120vw); }
        }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(14, 165, 233, 0.4);
            backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50; text-align: center;
        }

        .hidden { display: none !important; }

        .btn-sponge {
            background: #FDE047;
            color: #92400E;
            font-family: 'Mitr', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            padding: 1rem 2rem;
            border-radius: 9999px;
            border: 5px solid #B45309;
            cursor: pointer;
            box-shadow: 0 8px 0 #92400E;
            transition: all 0.1s;
            margin-top: 1.5rem;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
            width: 100%;
        }

        .btn-sponge:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #92400E;
        }
        
        .btn-sponge:disabled {
            background: #D1D5DB;
            border-color: #6B7280;
            color: #4B5563;
            box-shadow: 0 8px 0 #4B5563;
            cursor: not-allowed;
        }

        #confetti-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 40;
        }

        /* เป้าชี้ตำแหน่งมือ AR */
        #hand-cursor {
            position: absolute;
            width: 30px; height: 30px;
            background: rgba(59, 130, 246, 0.6); /* สีฟ้าใส */
            border: 3px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10000;
            display: none; /* ซ่อนไว้ก่อนจนกว่าจะเจอมือ */
            transition: transform 0.1s ease-out, background 0.1s ease-out;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        #hand-cursor.pinching {
            transform: translate(-50%, -50%) scale(0.6);
            background: rgba(16, 185, 129, 0.9); /* เปลี่ยนเป็นสีเขียวเมื่อจีบนิ้ว */
            border-color: #FDE047;
        }

    </style>
</head>
<body>
    <video id="webcam-video" autoplay playsinline></video>
    <div id="hand-cursor"></div>

    <div id="game-container">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>

        <div id="ar-world"></div>

        <canvas id="confetti-canvas"></canvas>

        <div id="ui-layer">
            <div class="top-section">
                <div class="stats-bar">
                    <div class="stat-box">⭐ <span id="score">0</span></div>
                    <div class="stat-box">⏱️ <span id="timer">60</span>s</div>
                </div>
                <div class="sponge-panel question-box">
                    <div class="heading-font text-blue-900 text-sm mb-0.5">คำใบ้:</div>
                    <div id="word-hint" class="text-xl text-yellow-900 font-bold">หาตัวอักษรมาเติมให้เต็ม</div>
                </div>
            </div>

            <div id="play-area"></div>

            <div class="bottom-section">
                <div id="target-word-display" class="heading-font"></div>
            </div>
        </div>

        <div id="start-screen" class="overlay-screen">
            <div class="sponge-panel p-6 max-w-sm mx-4">
                <h1 class="text-5xl heading-font text-yellow-600 mb-4 tracking-wide" style="text-shadow: 2px 2px 0px white, -1px -1px 0px white;">เกมล่าคำไทย</h1>
                <p class="text-sm font-semibold text-blue-900 text-left bg-white bg-opacity-60 p-3 rounded-xl">
                    📸 <strong>เปิดกล้องเพื่อเล่นระบบ AR!</strong><br>
                    ✨ <strong>จีบนิ้ว</strong> กลางอากาศเพื่อลากฟองสบู่<br>
                    ✨ <strong>จีบนิ้ว 2 ครั้งเร็วๆ</strong> เพื่อเลือกคำตอบ<br>
                    (หรือแตะ/ลาก บนหน้าจอแบบปกติก็ได้)
                </p>
                <button id="start-btn" class="btn-sponge">เริ่มเล่นโหมด AR!</button>
                <button id="start-normal-btn" class="btn-sponge !mt-2 !text-sm !py-3" style="background:#fff; color:#3B82F6; border-color:#60A5FA; box-shadow: 0 6px 0 #60A5FA;">เล่นโหมดปกติ (ไม่เปิดกล้อง)</button>
            </div>
        </div>

        <div id="game-over-screen" class="overlay-screen hidden">
            <div class="sponge-panel p-8 max-w-sm mx-4">
                <h1 class="text-4xl heading-font text-red-600 mb-2">หมดเวลา!</h1>
                <p class="text-xl font-bold text-blue-900">คะแนนของคุณ</p>
                <p class="text-7xl font-black text-yellow-600 my-4 heading-font" style="text-shadow: 3px 3px 0 white;" id="final-score">0</p>
                <button id="restart-btn" class="btn-sponge" style="font-size: 1.5rem;">เล่นอีกครั้ง</button>
            </div>
        </div>

    </div>

    <script>
        const vocabulary = [
            { word: "สวัสดี", hint: "คำทักทายของคนไทยเมื่อพบกัน" },
            { word: "ขอบคุณ", hint: "คำกล่าวแสดงความรู้สึกซาบซึ้ง" },
            { word: "อาหาร", hint: "สิ่งที่เรากินเพื่อดำรงชีวิต" },
            { word: "ครอบครัว", hint: "กลุ่มคนที่มีความสัมพันธ์กันทางสายเลือด" },
            { word: "ความสุข", hint: "ความรู้สึกดีใจ อิ่มเอมใจ" },
            { word: "โรงเรียน", hint: "สถานที่สำหรับศึกษาเล่าเรียน" },
            { word: "ฟองน้ำ", hint: "ของใช้นุ่มนิ่ม ซับน้ำได้ดี หรือตัวการ์ตูน" },
            { word: "ทะเล", hint: "แหล่งน้ำเค็มขนาดใหญ่" },
            { word: "น่ารัก", hint: "ดูดี ถูกใจ น่าเอ็นดู" },
            { word: "รอยยิ้ม", hint: "อาการที่แสดงความสุขบนใบหน้า" }
        ];

        const thaiConsonants = "กขคงจฉชซญดตถทธนบปผฝพฟภมยรลวศษสหอ";
        const thaiVowels = "ะาิีึืุูเแโใไ"; 

        let currentWordObj = null;
        let targetWord = [];
        let collectedWord = "";
        let score = 0;
        let timeLeft = 60;
        let gameInterval;
        let isPlaying = false;
        let arModeActive = false;

        // AR & Gesture State
        let isPinching = false;
        let grabbedElement = null;
        let lastPinchTime = 0;
        let lastGrabbedElement = null;

        const arWorld = document.getElementById('ar-world');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const targetWordDisplay = document.getElementById('target-word-display');
        const hintDisplay = document.getElementById('word-hint');
        
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        
        const startBtn = document.getElementById('start-btn');
        const startNormalBtn = document.getElementById('start-normal-btn');
        const restartBtn = document.getElementById('restart-btn');
        const videoElement = document.getElementById('webcam-video');
        const handCursor = document.getElementById('hand-cursor');

        function initGame() {
            startBtn.addEventListener('click', () => startARGame());
            startNormalBtn.addEventListener('click', () => startGame(false));
            restartBtn.addEventListener('click', () => startGame(arModeActive));
        }

        // --- AR Camera & MediaPipe Logic ---
        async function startARGame() {
            startBtn.textContent = 'กำลังเตรียมกล้อง...';
            startBtn.disabled = true;
            startNormalBtn.style.display = 'none';

            try {
                const hands = new Hands({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                }});
                
                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.65,
                    minTrackingConfidence: 0.65
                });
                
                hands.onResults(onARResults);

                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({image: videoElement});
                    },
                    width: 640,
                    height: 480
                });
                
                await camera.start();
                startGame(true);
            } catch (error) {
                console.error("Camera Error:", error);
                alert("ไม่สามารถเปิดกล้องได้ จะเปลี่ยนเป็นโหมดปกติแทนครับ");
                startGame(false);
            }
        }

        function onARResults(results) {
            if (!isPlaying) return;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // จุดที่ 8 คือปลายนิ้วชี้, จุดที่ 4 คือปลายนิ้วโป้ง
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                // แปลงพิกัดจากกล้องเป็นหน้าจอ (คูณด้วยขนาดจอ และกลับแกน X เพราะกล้องสะท้อน)
                const screenW = window.innerWidth;
                const screenH = window.innerHeight;
                const handX = (1 - indexTip.x) * screenW;
                const handY = indexTip.y * screenH;

                // อัปเดตตำแหน่งเป้าสายตา
                handCursor.style.left = `${handX}px`;
                handCursor.style.top = `${handY}px`;
                handCursor.style.display = 'block';

                // คำนวณระยะห่างระหว่างนิ้วชี้และนิ้วโป้ง (เพื่อตรวจจับการจีบ)
                const dx = indexTip.x - thumbTip.x;
                const dy = indexTip.y - thumbTip.y;
                const dz = indexTip.z - thumbTip.z;
                const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);
                
                const pinchThreshold = 0.055; // ปรับความอ่อนไหวของการจีบ
                const currentlyPinching = distance < pinchThreshold;

                if (currentlyPinching && !isPinching) {
                    // เริ่มจีบนิ้ว
                    isPinching = true;
                    handCursor.classList.add('pinching');
                    handlePinchStart(handX, handY);
                } else if (!currentlyPinching && isPinching) {
                    // ปล่อยนิ้ว
                    isPinching = false;
                    handCursor.classList.remove('pinching');
                    handlePinchEnd();
                }

                // ถ้ากำลังจีบและจับฟองน้ำอยู่ ให้เลื่อนฟองน้ำตามมือ
                if (isPinching && grabbedElement) {
                    grabbedElement.style.left = `${handX - 40}px`; // -40 เพื่อให้อยู่ตรงกลางฟอง
                    grabbedElement.style.top = `${handY - 40}px`;
                }

            } else {
                // ไม่เจอมือ
                handCursor.style.display = 'none';
                if (isPinching) {
                    isPinching = false;
                    handCursor.classList.remove('pinching');
                    handlePinchEnd();
                }
            }
        }

        function handlePinchStart(x, y) {
            // ค้นหาฟองน้ำที่อยู่ใต้เคอร์เซอร์
            const elements = document.elementsFromPoint(x, y);
            const bubble = elements.find(el => el.classList.contains('floating-letter'));

            if (bubble) {
                grabbedElement = bubble;
                grabbedElement.classList.add('grabbed');

                const now = Date.now();
                // ตรวจสอบ Double Pinch (จีบ 2 ครั้งติดกันใน 450ms บนฟองเดิม)
                if (now - lastPinchTime < 450 && lastGrabbedElement === grabbedElement) {
                    // จีบ 2 ครั้ง -> เลือกคำตอบ!
                    const char = grabbedElement.textContent;
                    playPopSound();
                    
                    const rect = grabbedElement.getBoundingClientRect();
                    showFloatingText('✨ เลือก!', rect.left, rect.top - 20, '#3B82F6');
                    
                    checkLetter(char, grabbedElement);
                    grabbedElement.classList.remove('grabbed');
                    grabbedElement = null; // ปล่อย
                    lastPinchTime = 0; // รีเซ็ตเวลา
                } else {
                    // จีบครั้งแรก -> บันทึกเวลาและเตรียมลาก
                    lastPinchTime = now;
                    lastGrabbedElement = grabbedElement;
                }
            }
        }

        function handlePinchEnd() {
            if (grabbedElement) {
                grabbedElement.classList.remove('grabbed');
                grabbedElement = null;
            }
        }

        // --- Game Flow ---
        function startGame(useAR) {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            arModeActive = useAR;
            if (arModeActive) {
                document.body.classList.add('ar-active');
                videoElement.classList.add('active');
            } else {
                document.body.classList.remove('ar-active');
                videoElement.classList.remove('active');
            }
            
            score = 0;
            timeLeft = 60;
            isPlaying = true;
            updateScore();
            updateTimerDisplay();
            arWorld.innerHTML = '';
            
            startMusic();
            loadNextWord();
            
            gameInterval = setInterval(updateTimer, 1000);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            stopMusic();
            
            finalScoreDisplay.textContent = score;
            gameOverScreen.classList.remove('hidden');
            
            const letters = document.querySelectorAll('.floating-letter');
            letters.forEach(l => l.style.animationPlayState = 'paused');

            // Reset start buttons state
            startBtn.textContent = 'เริ่มเล่นโหมด AR อีกครั้ง';
            startBtn.disabled = false;
            startNormalBtn.style.display = 'block';
            handCursor.style.display = 'none';
        }

        function updateTimer() {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) endGame();
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = timeLeft;
            timerDisplay.style.color = timeLeft <= 10 ? '#DC2626' : '#2563EB';
        }

        function updateScore() {
            scoreDisplay.textContent = score;
        }

        function loadNextWord() {
            arWorld.innerHTML = ''; 
            const randomIndex = Math.floor(Math.random() * vocabulary.length);
            currentWordObj = vocabulary[randomIndex];
            targetWord = Array.from(currentWordObj.word); 
            collectedWord = "";
            hintDisplay.textContent = currentWordObj.hint;
            renderTargetDisplay();
            
            targetWord.forEach(char => spawnSpecificLetter(char));
            
            const extraBubblesCount = 8; // ลดจำนวนฟองหลอกลงนิดหน่อยให้ลากง่ายขึ้น
            for(let i=0; i < extraBubblesCount; i++) {
                spawnSpecificLetter(getRandomThaiChar());
            }
        }

        function renderTargetDisplay() {
            let displayHtml = '';
            for (let i = 0; i < targetWord.length; i++) {
                if (i < collectedWord.length) {
                    displayHtml += `<div class="word-slot">${collectedWord[i]}</div>`; 
                } else {
                    displayHtml += `<div class="word-slot empty">_</div>`; 
                }
            }
            targetWordDisplay.innerHTML = displayHtml;
        }

        function getRandomThaiChar() {
            const source = Math.random() > 0.3 ? thaiConsonants : thaiVowels;
            return source[Math.floor(Math.random() * source.length)];
        }

        function spawnSpecificLetter(char) {
            const letterEl = document.createElement('div');
            letterEl.className = 'floating-letter';
            letterEl.textContent = char;

            const size = 80;
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            
            const minX = 20;
            const maxX = Math.max(minX, screenW - size - 20);
            const minY = 140; 
            const maxY = Math.max(minY, screenH - size - 160);

            const x = Math.random() * (maxX - minX) + minX;
            const y = Math.random() * (maxY - minY) + minY;

            letterEl.style.left = `${x}px`;
            letterEl.style.top = `${y}px`;
            letterEl.style.animationDelay = `${Math.random() * 2}s`;
            
            // --- Fallback สำหรับแตะและลากด้วยเมาส์/นิ้ว (Touch Screen) ---
            let moved = false;
            let startX, startY;
            let initialLeft, initialTop;
            let lastTouchTapTime = 0;

            letterEl.addEventListener('pointerdown', (e) => {
                if(letterEl.classList.contains('popping') || arModeActive) return; // ถ้าใช้กล้องให้ใช้มือลากแทน
                moved = false;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = parseFloat(letterEl.style.left) || x;
                initialTop = parseFloat(letterEl.style.top) || y;
                
                letterEl.setPointerCapture(e.pointerId);
                letterEl.classList.add('grabbed');
            });

            letterEl.addEventListener('pointermove', (e) => {
                if (!letterEl.hasPointerCapture(e.pointerId)) return;
                
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;
                
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
                
                if (moved) {
                    let newX = initialLeft + dx;
                    let newY = initialTop + dy;
                    newX = Math.max(10, Math.min(newX, window.innerWidth - 90));
                    newY = Math.max(110, Math.min(newY, window.innerHeight - 150));

                    letterEl.style.left = `${newX}px`;
                    letterEl.style.top = `${newY}px`;
                }
            });

            letterEl.addEventListener('pointerup', (e) => {
                if(letterEl.classList.contains('popping') || arModeActive) return;
                letterEl.releasePointerCapture(e.pointerId);
                letterEl.classList.remove('grabbed');
                
                if (!moved) {
                    const currentTime = new Date().getTime();
                    const tapLength = currentTime - lastTouchTapTime;
                    
                    if (tapLength < 350 && tapLength > 0) {
                        playPopSound();
                        showFloatingText('✨ Select!', e.clientX, e.clientY - 20, '#3B82F6');
                        checkLetter(char, letterEl);
                        lastTouchTapTime = 0;
                    } else {
                        lastTouchTapTime = currentTime;
                        playPopSound();
                        checkLetter(char, letterEl);
                    }
                }
            });

            arWorld.appendChild(letterEl);
        }

        function checkLetter(char, element) {
            if (collectedWord.length < targetWord.length) {
                const neededChar = targetWord[collectedWord.length];
                const rect = element.getBoundingClientRect();
                
                if (char === neededChar) {
                    element.classList.add('popping');
                    setTimeout(() => {
                        if(element.parentNode === arWorld) arWorld.removeChild(element);
                    }, 200);

                    collectedWord += char;
                    score += 10;
                    updateScore();
                    renderTargetDisplay();
                    
                    showFloatingText('+10', rect.left, rect.top, '#10B981');

                    if (collectedWord.length === targetWord.length) {
                        wordComplete();
                    }
                } else {
                    showFloatingText('ผิด!', rect.left, rect.top, '#EF4444');
                }
            }
        }

        function wordComplete() {
            score += 50; 
            updateScore();
            
            targetWordDisplay.style.transform = 'scale(1.15)';
            targetWordDisplay.style.transition = 'transform 0.2s';
            setTimeout(() => targetWordDisplay.style.transform = 'scale(1)', 300);
            
            playWinSound();
            fireConfetti();
            
            setTimeout(() => {
                loadNextWord();
            }, 1200);
        }

        function showFloatingText(text, x, y, color) {
            const floater = document.createElement('div');
            floater.textContent = text;
            floater.style.position = 'fixed';
            floater.style.left = `${Math.max(10, Math.min(x, window.innerWidth - 120))}px`;
            floater.style.top = `${Math.max(10, Math.min(y, window.innerHeight - 80))}px`;
            floater.style.color = color;
            floater.style.fontWeight = '900';
            floater.style.fontSize = '2.2rem';
            floater.style.textShadow = '2px 2px 0 white, -2px -2px 0 white, 2px -2px 0 white, -2px 2px 0 white';
            floater.style.pointerEvents = 'none';
            floater.style.zIndex = '10000';
            floater.style.transition = 'all 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
            
            document.body.appendChild(floater);
            
            setTimeout(() => {
                floater.style.transform = 'translateY(-60px) scale(1.2)';
                floater.style.opacity = '0';
            }, 20);
            
            setTimeout(() => {
                if(floater.parentNode) document.body.removeChild(floater);
            }, 800);
        }

        // --- Audio & Effects ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let musicPlaying = false;
        let musicTimer = null;

        function playNote(freq, duration, startTime, volume = 0.05, type="triangle") {
            if(audioCtx.state === 'suspended') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(volume, startTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

        function playPopSound() {
            if (audioCtx.state === "suspended") audioCtx.resume();
            const now = audioCtx.currentTime;
            playNote(600, 0.1, now, 0.1, "sine");
            playNote(1000, 0.15, now + 0.02, 0.05, "sine");
        }
        
        function playWinSound() {
            if (audioCtx.state === "suspended") audioCtx.resume();
            const now = audioCtx.currentTime;
            playNote(523.25, 0.1, now, 0.1, "square");
            playNote(659.25, 0.1, now + 0.1, 0.1, "square");
            playNote(783.99, 0.3, now + 0.2, 0.1, "square");
        }

        function startMusic() {
            if (musicPlaying) return;
            musicPlaying = true;
            if (audioCtx.state === "suspended") audioCtx.resume();
            playMelody();
        }

        function playMelody() {
            if (!musicPlaying) return;
            const now = audioCtx.currentTime;
            const melody = [392.00, 523.25, 659.25, 523.25, 783.99, 659.25, 523.25, 392.00];
            melody.forEach((note, i) => {
                playNote(note, 0.3, now + i * 0.4, 0.02, "sine");
            });
            musicTimer = setTimeout(playMelody, 4000);
        }

        function stopMusic() {
            musicPlaying = false;
            if (musicTimer) { clearTimeout(musicTimer); musicTimer = null; }
        }

        function fireConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const particles = [];
            const colors = ['#FDE047', '#60A5FA', '#34D399', '#F472B6', '#FFFFFF'];
            
            for(let i=0; i<80; i++) {
                particles.push({
                    x: canvas.width / 2, y: canvas.height / 2 + 100,
                    vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 1) * 30 - 5,
                    size: Math.random() * 10 + 5, 
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rot: Math.random() * 360, rotSpeed: (Math.random() - 0.5) * 15
                });
            }
            
            let frame = 0;
            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let activeParticles = 0;
                
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy; p.vy += 1;
                    p.rot += p.rotSpeed;
                    
                    if (p.y < canvas.height) {
                        activeParticles++;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rot * Math.PI / 180);
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(0, 0, p.size, 0, Math.PI * 2); 
                        ctx.fill();
                        ctx.restore();
                    }
                });
                
                frame++;
                if (activeParticles > 0 && frame < 150) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            animateConfetti();
        }

        window.onload = initGame;
    </script>
</body>
