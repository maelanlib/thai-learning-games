<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<title>Pixel Folder Tree</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

body{
margin:0;
background:#101018;
color:white;
font-family:'Press Start 2P',monospace;
}

.container{
max-width:950px;
margin:30px auto;
background:#1b1b2f;
border:4px solid #7c5cff;
padding:25px;
box-shadow:8px 8px 0 #000;
}

h1{
text-align:center;
color:#ffd166;
font-size:20px;
}

input{
display:none;
}

.btn{
display:block;
background:#7c5cff;
padding:15px;
text-align:center;
cursor:pointer;
box-shadow:4px 4px 0 #000;
margin-bottom:15px;
}

button{
width:100%;
padding:15px;
background:#00b894;
border:0;
color:white;
font-family:inherit;
cursor:pointer;
box-shadow:4px 4px 0 #000;
margin-bottom:20px;
}

#tree{
background:#080812;
border:3px solid #333;
padding:20px;
line-height:1.8;
font-size:13px;
white-space:pre;
}

.folder{
color:#ffd166;
cursor:pointer;
}

.file{
color:#8be9fd;
}

#popup{
position:fixed;
top:30px;
left:50%;
transform:translateX(-50%);
background:#00b894;
padding:15px 25px;
border:4px solid #000;
box-shadow:6px 6px 0 #000;
display:none;
z-index:99;
}
</style>

</head>

<body>

<div class="container">

<h1>📁 PIXEL FOLDER TREE</h1>

<label class="btn">
📂 SELECT FOLDER
<input id="folder" type="file" webkitdirectory multiple>
</label>

<button onclick="copyTree()">
📋 COPY STRUCTURE
</button>

<div id="tree">
ยังไม่ได้เลือกโฟลเดอร์...
</div>

</div>

<div id="popup"></div>


<script>

let treeData={};
let structure="";

const input=document.getElementById("folder");
const tree=document.getElementById("tree");


input.addEventListener("change",()=>{

let files=[...input.files];

treeData={};


files.forEach(file=>{

let path=file.webkitRelativePath.split("/");
let current=treeData;


path.forEach((part,index)=>{

if(!current[part]){

current[part]=
index===path.length-1
?null
:{};

}

if(current[part]!==null){

current=current[part];

}

});

});


renderTree();

});



function getIcon(name,data){

if(data!==null)
return "📁";


let ext=name.split(".").pop().toLowerCase();


if(["png","jpg","jpeg","webp","gif"].includes(ext))
return "🖼️";


if(["js","html","css"].includes(ext))
return "💻";


if(["json","tmj","tmx"].includes(ext))
return "⚙️";


return "📄";

}



function renderTree(){

tree.innerHTML="";


let keys=Object.keys(treeData);


keys.forEach((key,index)=>{

createNode(
key,
treeData[key],
tree,
"",
index===keys.length-1
);

});


}



function createNode(name,data,parent,prefix,last){


let row=document.createElement("div");

let branch=
prefix+(last?"└── ":"├── ");


row.textContent=
branch+
getIcon(name,data)+" "+name;



parent.appendChild(row);



if(data!==null){


row.className="folder";


let children=document.createElement("div");

parent.appendChild(children);



row.onclick=()=>{


if(children.style.display==="none"){

children.style.display="block";

row.textContent=
branch+"📂 "+name;

}else{

children.style.display="none";

row.textContent=
branch+"📁 "+name;

}

};



let keys=Object.keys(data);


keys.forEach((key,index)=>{


createNode(

key,
data[key],
children,
prefix+(last?"    ":"│   "),
index===keys.length-1

);


});


}else{


row.className="file";


}



}



function buildCopy(obj,prefix=""){


let text="";


let keys=Object.keys(obj);


keys.forEach((key,index)=>{


let last=index===keys.length-1;

let data=obj[key];


text+=
prefix+
(last?"└── ":"├── ")
+
getIcon(key,data)
+" "
+key+"\n";


if(data!==null){

text+=buildCopy(

data,

prefix+(last?"    ":"│   ")

);

}


});


return text;

}




function copyTree(){


if(Object.keys(treeData).length===0){

showPopup("❌ ยังไม่ได้เลือก Folder");

return;

}


structure=buildCopy(treeData);


navigator.clipboard.writeText(structure);


showPopup("✅ Copy Structure แล้ว!");

}




function showPopup(msg){

let p=document.getElementById("popup");

p.textContent=msg;

p.style.display="block";


setTimeout(()=>{

p.style.display="none";

},2000);


}

</script>

</body>
</html>
