<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมคำไทยคู่ใจ - AR UI Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            user-select: none;
        }
        
        .progress-ring-circle {
            transition: stroke-dashoffset 0.05s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .cursor-large {
            cursor: pointer;
        }
    </style>
</head>
<body class="overflow-hidden bg-slate-900 w-screen h-screen relative flex items-center justify-center">

    <!-- ภาพพื้นหลัง AR -->
    <div class="absolute inset-0 z-0">
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?q=80&w=2560&auto=format&fit=crop')] bg-cover bg-center filter blur-md transform scale-105"></div>
        <div class="absolute inset-0 bg-stone-900/40"></div>
    </div>

    <!-- หน้าจอเริ่มเกม -->
    <div id="start-screen" class="absolute inset-0 z-50 bg-stone-900/80 backdrop-blur-sm flex flex-col items-center justify-center text-white transition-opacity duration-500">
        <h1 class="text-7xl font-bold mb-6 text-amber-100 drop-shadow-lg">คำไทยคู่ใจ</h1>
        <p class="text-3xl mb-12 text-stone-200">จำลองระบบ AR Hand Tracking</p>
        <button onclick="startGame()" class="px-12 py-5 bg-emerald-600 hover:bg-emerald-500 rounded-full text-4xl font-bold shadow-xl transition-all hover:scale-105 flex items-center gap-4">
            <i class="ph-fill ph-play-circle"></i> เริ่มเล่นเกม
        </button>
        <p class="text-xl mt-8 text-stone-400 max-w-2xl text-center">เปิดเสียงเพื่อฟังดนตรีผ่อนคลาย<br>วิธีเล่น: เลื่อนเมาส์ <b>"วางค้างไว้"</b> บนปุ่มคำตอบจนวงแหวนเต็ม</p>
    </div>

    <!-- UI หลักของเกม -->
    <div id="game-ui" class="relative z-10 w-full max-w-7xl h-full flex flex-col justify-between p-8 opacity-0 pointer-events-none transition-opacity duration-500">
        
        <!-- ส่วนบน: HUD -->
        <div class="flex justify-between items-center w-full">
            <div class="bg-stone-800/80 backdrop-blur-md px-8 py-4 rounded-3xl border border-stone-600/50 shadow-xl flex items-center gap-4 text-amber-300">
                <i class="ph-fill ph-trophy text-5xl"></i>
                <div class="text-4xl font-bold">คะแนน <span id="score-display">0</span></div>
            </div>

            <div class="flex items-center gap-6">
                <button onclick="toggleMute()" class="bg-stone-800/80 backdrop-blur-md w-20 h-20 rounded-full border border-stone-600/50 shadow-xl flex items-center justify-center text-white hover:bg-stone-700 transition-colors text-4xl">
                    <i id="sound-icon" class="ph-fill ph-speaker-high"></i>
                </button>
                <div class="bg-stone-800/80 backdrop-blur-md px-8 py-4 rounded-3xl border border-stone-600/50 shadow-xl flex items-center gap-4 text-white">
                    <i class="ph-fill ph-timer text-5xl"></i>
                    <div id="timer" class="text-4xl font-bold tracking-widest">03:00</div>
                </div>
            </div>
        </div>

        <!-- ส่วนกลาง: การ์ดคำถาม (ปรับขนาดให้เล็กลง) -->
        <div class="flex-1 flex flex-col items-center justify-center">
            <!-- ปรับขนาด max-w-4xl เป็น max-w-3xl และลด padding ลง -->
            <div id="question-card" class="bg-stone-50/95 backdrop-blur-lg rounded-[2.5rem] shadow-2xl p-10 max-w-3xl w-full text-center border-4 border-white transition-transform duration-300 relative z-10">
                <h2 id="question-text" class="text-5xl font-bold text-stone-800 mb-6 leading-tight">
                    โหลดคำถาม...
                </h2>
                <div class="text-2xl font-medium text-stone-500">
                    เลือกคำตอบที่ถูกต้อง
                </div>
            </div>

            <!-- ข้อความตอบกลับ -->
            <div id="feedback" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-5xl font-bold opacity-0 transition-opacity duration-300 bg-white/95 px-12 py-8 rounded-3xl shadow-2xl border-4 z-50 pointer-events-none">
                ✓ ถูกต้อง! +10 คะแนน
            </div>
        </div>

        <!-- ส่วนล่าง: ปุ่มคำตอบ -->
        <div class="flex justify-between items-center w-full px-24 pb-8">
            
            <div class="relative flex items-center justify-center w-[280px] h-[280px]" 
                 onmouseenter="startDwell('left')" 
                 onmouseleave="cancelDwell('left')">
                <svg class="absolute inset-0 w-full h-full pointer-events-none drop-shadow-lg" viewBox="0 0 300 300">
                    <circle cx="150" cy="150" r="135" stroke="rgba(255, 255, 255, 0.2)" stroke-width="16" fill="none" />
                    <!-- เปลี่ยนเป็นสีฟ้ากลางๆ -->
                    <circle id="ring-left" class="progress-ring-circle" cx="150" cy="150" r="135" stroke="#38bdf8" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="848.23" stroke-dashoffset="848.23" />
                </svg>
                <button id="btn-left" class="cursor-large w-[230px] h-[230px] rounded-full bg-white text-stone-800 text-5xl font-bold shadow-2xl hover:bg-stone-50 transition-colors z-10 flex items-center justify-center border-4 border-stone-200">
                    ตัวเลือก 1
                </button>
            </div>

            <div class="relative flex items-center justify-center w-[280px] h-[280px]" 
                 onmouseenter="startDwell('right')" 
                 onmouseleave="cancelDwell('right')">
                <svg class="absolute inset-0 w-full h-full pointer-events-none drop-shadow-lg" viewBox="0 0 300 300">
                    <circle cx="150" cy="150" r="135" stroke="rgba(255, 255, 255, 0.2)" stroke-width="16" fill="none" />
                    <!-- เปลี่ยนเป็นสีฟ้ากลางๆ -->
                    <circle id="ring-right" class="progress-ring-circle" cx="150" cy="150" r="135" stroke="#38bdf8" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="848.23" stroke-dashoffset="848.23" />
                </svg>
                <button id="btn-right" class="cursor-large w-[230px] h-[230px] rounded-full bg-white text-stone-800 text-5xl font-bold shadow-2xl hover:bg-stone-50 transition-colors z-10 flex items-center justify-center border-4 border-stone-200">
                    ตัวเลือก 2
                </button>
            </div>

        </div>
    </div>

    <script>
        // --- ฐานข้อมูลคำถาม ---
        const questionDatabase = [
            { text: "คำว่า <span class='text-amber-600'>‘โกรธ’</span><br>มีความหมายเหมือนกับคำใด?", correct: "โมโห", wrong: "ดีใจ" },
            { text: "คำว่า <span class='text-amber-600'>‘รับประทาน’</span><br>มีความหมายเหมือนกับคำใด?", correct: "กิน", wrong: "นอนหลับ" },
            { text: "คำว่า <span class='text-amber-600'>‘รวดเร็ว’</span><br>มีความหมายเหมือนกับคำใด?", correct: "ว่องไว", wrong: "เชื่องช้า" },
            { text: "คำว่า <span class='text-amber-600'>‘สวยงาม’</span><br>มีความหมายเหมือนกับคำใด?", correct: "งดงาม", wrong: "น่าเกลียด" },
            { text: "คำว่า <span class='text-amber-600'>‘ใหญ่โต’</span><br>มีความหมายตรงข้ามกับคำใด?", correct: "เล็กจิ๋ว", wrong: "มโหฬาร" },
            { text: "คำว่า <span class='text-amber-600'>‘สว่าง’</span><br>มีความหมายตรงข้ามกับคำใด?", correct: "มืดมิด", wrong: "เจิดจ้า" },
            { text: "คำว่า <span class='text-amber-600'>‘ยาก’</span><br>มีความหมายตรงข้ามกับคำใด?", correct: "ง่าย", wrong: "ลำบาก" },
            { text: "คำว่า <span class='text-amber-600'>‘พูดจา’</span><br>มีความหมายเหมือนกับคำใด?", correct: "สนทนา", wrong: "เงียบงัน" }
        ];

        let currentQuestionList = [];
        let correctSide = 'left';

        // --- Game State ---
        let score = 0;
        let timeLeft = 180; // 3 นาที
        let gameTimerId = null;
        let isMuted = false;
        let isAnswered = false;

        // --- Audio System (Web Audio API) ---
        let audioCtx;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- ระบบ BGM ผ่อนคลาย (Generative Ambient) ---
        // ใช้ Pentatonic Scale เพื่อให้เสียงฟังดูไพเราะและผ่อนคลายเสมอ
        const pentatonicScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25]; // C, D, E, G, A, C
        
        function playAmbientNote() {
            if(isMuted || !audioCtx) return;
            const freq = pentatonicScale[Math.floor(Math.random() * pentatonicScale.length)];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine'; // เสียงนุ่มนวลเหมือนกระดิ่งลม/แก้ว
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // ค่อยๆ ดังขึ้นและค่อยๆ เบาลง (Fade in / Fade out ช้าๆ)
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.015, audioCtx.currentTime + 1.5); 
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 6);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 6);
        }

        function startAmbientBGM() {
            // เล่นโน้ตแบบสุ่มเป็นระยะๆ เพื่อสร้างบรรยากาศ
            setInterval(() => { if(!isMuted) playAmbientNote(); }, 3500);
            setTimeout(() => {
                setInterval(() => { if(!isMuted) playAmbientNote(); }, 5000);
            }, 1500);
        }

        // --- Sound Effects ---
        function playTone(freq, type, duration, vol = 0.1) {
            if(isMuted || !audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playHoverSound() {
            playTone(400, 'sine', 0.1, 0.02);
        }

        function playCorrectSound() {
            playTone(523.25, 'sine', 0.1, 0.05);
            setTimeout(() => playTone(659.25, 'sine', 0.1, 0.05), 100);
            setTimeout(() => playTone(783.99, 'sine', 0.3, 0.08), 200);
        }

        function playWrongSound() {
            playTone(200, 'triangle', 0.3, 0.05);
            setTimeout(() => playTone(180, 'triangle', 0.4, 0.05), 150);
        }

        // --- Logic เกม ---
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        function loadNextQuestion() {
            if(currentQuestionList.length === 0) {
                // ถ้าคำถามหมด ให้สุ่มชุดใหม่มาเล่นซ้ำ
                currentQuestionList = shuffleArray([...questionDatabase]);
            }
            
            const qData = currentQuestionList.pop();
            document.getElementById('question-text').innerHTML = qData.text;

            // สุ่มตำแหน่งคำตอบถูก
            if(Math.random() > 0.5) {
                correctSide = 'left';
                document.getElementById('btn-left').innerText = qData.correct;
                document.getElementById('btn-right').innerText = qData.wrong;
            } else {
                correctSide = 'right';
                document.getElementById('btn-right').innerText = qData.correct;
                document.getElementById('btn-left').innerText = qData.wrong;
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startGame() {
            initAudio();
            startAmbientBGM(); // เริ่มเล่นเพลง
            
            currentQuestionList = shuffleArray([...questionDatabase]);
            loadNextQuestion();

            const startScreen = document.getElementById('start-screen');
            const gameUi = document.getElementById('game-ui');
            
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                gameUi.style.opacity = '1';
                gameUi.style.pointerEvents = 'auto';
                
                gameTimerId = setInterval(() => {
                    if (timeLeft > 0 && !isAnswered) {
                        timeLeft--;
                        document.getElementById('timer').innerText = formatTime(timeLeft);
                    }
                }, 1000);
            }, 500);
        }

        function toggleMute() {
            isMuted = !isMuted;
            const icon = document.getElementById('sound-icon');
            if(isMuted) {
                icon.classList.remove('ph-speaker-high');
                icon.classList.add('ph-speaker-x', 'text-stone-400');
            } else {
                icon.classList.remove('ph-speaker-x', 'text-stone-400');
                icon.classList.add('ph-speaker-high');
                playHoverSound();
            }
        }

        // --- AR Dwell-to-Click Interaction ---
        const DWELL_TIME_MS = 1200; // ลดเวลาเหลือ 1.2 วินาทีให้ไวขึ้นนิดนึง
        const FPS = 60;
        const CIRCUMFERENCE = 848.23; 
        
        let dwellIntervals = { left: null, right: null };
        let currentProgress = { left: 0, right: 0 };
        const incrementPerFrame = 100 / (DWELL_TIME_MS / (1000 / FPS));

        function setRingProgress(side, percent) {
            const ring = document.getElementById(`ring-${side}`);
            if(!ring) return;
            const offset = CIRCUMFERENCE - (percent / 100) * CIRCUMFERENCE;
            ring.style.strokeDashoffset = offset;
        }

        function startDwell(side) {
            if(isAnswered) return;
            playHoverSound();
            if(dwellIntervals[side]) clearInterval(dwellIntervals[side]);
            
            dwellIntervals[side] = setInterval(() => {
                currentProgress[side] += incrementPerFrame;
                if(currentProgress[side] >= 100) {
                    currentProgress[side] = 100;
                    clearInterval(dwellIntervals[side]);
                    submitAnswer(side);
                }
                setRingProgress(side, currentProgress[side]);
            }, 1000 / FPS);
            
            document.getElementById(`btn-${side}`).style.transform = 'scale(1.05)';
        }

        function cancelDwell(side) {
            if(isAnswered) return;
            if(dwellIntervals[side]) clearInterval(dwellIntervals[side]);
            
            dwellIntervals[side] = setInterval(() => {
                currentProgress[side] -= incrementPerFrame * 2; 
                if(currentProgress[side] <= 0) {
                    currentProgress[side] = 0;
                    clearInterval(dwellIntervals[side]);
                }
                setRingProgress(side, currentProgress[side]);
            }, 1000 / FPS);
            
            document.getElementById(`btn-${side}`).style.transform = 'scale(1)';
        }

        function submitAnswer(side) {
            isAnswered = true;
            const feedback = document.getElementById('feedback');
            const questionCard = document.getElementById('question-card');
            
            const otherSide = side === 'left' ? 'right' : 'left';
            cancelDwell(otherSide);

            // ตรวจสอบคำตอบ
            if(side === correctSide) {
                playCorrectSound();
                score += 10;
                const scoreDisplay = document.getElementById('score-display');
                scoreDisplay.innerText = score;
                scoreDisplay.classList.add('text-emerald-400', 'scale-125');
                setTimeout(() => scoreDisplay.classList.remove('text-emerald-400', 'scale-125'), 500);

                feedback.innerText = '✓ ถูกต้อง! +10 คะแนน';
                feedback.className = "absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-5xl font-bold opacity-0 transition-opacity duration-300 bg-white/95 px-12 py-8 rounded-3xl shadow-2xl border-4 z-50 pointer-events-none text-emerald-500 border-emerald-400";
                
                questionCard.style.transform = 'scale(0.95)';
                questionCard.style.opacity = '0.5';
            } else {
                playWrongSound();
                feedback.innerText = '✗ ยังไม่ใช่ครับ ลองใหม่นะ';
                feedback.className = "absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-5xl font-bold opacity-0 transition-opacity duration-300 bg-white/95 px-12 py-8 rounded-3xl shadow-2xl border-4 z-50 pointer-events-none text-rose-500 border-rose-400";
                
                questionCard.classList.add('animate-pulse');
                setTimeout(() => questionCard.classList.remove('animate-pulse'), 1000);
            }

            feedback.style.opacity = '1';
            
            // เปลี่ยนข้อถัดไปหลังจากแสดงผล 1.8 วินาที
            setTimeout(() => {
                feedback.style.opacity = '0';
                questionCard.style.transform = 'scale(1)';
                questionCard.style.opacity = '1';
                
                currentProgress['left'] = 0;
                currentProgress['right'] = 0;
                setRingProgress('left', 0);
                setRingProgress('right', 0);
                document.getElementById('btn-left').style.transform = 'scale(1)';
                document.getElementById('btn-right').style.transform = 'scale(1)';
                
                loadNextQuestion(); // โหลดคำถามใหม่
                isAnswered = false; 
            }, 1800);
        }
    </script>
</body>
</html>
