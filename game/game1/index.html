<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ฟาร์มพยัญชนะไทย</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --color-sky: #87CEEB;
            --color-grass: #90EE90;
            --color-wood: #8B4513;
            --color-wood-light: #DEB887;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(to bottom, var(--color-sky) 0%, var(--color-sky) 50%, var(--color-grass) 50%, var(--color-grass) 100%);
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none; /* Prevent scrolling on touch */
            user-select: none;
        }
        .font-mali { font-family: 'Mali', cursive; }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(-2deg); }
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes bounce-basket {
            0% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.05) translateY(10px); }
            100% { transform: scale(1) translateY(0); }
        }
        @keyframes sparkle {
            0% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.5) rotate(180deg); }
            100% { opacity: 0; transform: scale(0) rotate(360deg); }
        }

        .floating { animation: float 3s ease-in-out infinite; }
        .pop-in { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .bounce { animation: bounce-basket 0.3s ease-in-out; }

        .wood-board {
            background: linear-gradient(to bottom, #d2a679, #a67c52);
            border: 4px solid #5c3a21;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3), 0 4px 6px rgba(0,0,0,0.3);
        }
        .sign-rope {
            position: absolute;
            top: -20px;
            width: 4px;
            height: 20px;
            background: #8b5a2b;
            border-left: 1px dashed #deb887;
        }

        .wood-sign {
            background: linear-gradient(135deg, var(--color-wood-light), #cdaa7d);
            border: 4px solid var(--color-wood);
            border-radius: 16px;
            box-shadow: 0 6px 0 #5c2e0b, 0 8px 10px rgba(0,0,0,0.3);
            position: absolute;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 85px;
            height: 95px;
            z-index: 20;
            transition: transform 0.1s;
            text-align: center;
            /* Remove transform transition to prevent conflict with JS movement */
            transition: filter 0.2s, opacity 0.2s; 
        }
        .wood-sign:active { cursor: grabbing; transform: scale(0.95); box-shadow: 0 2px 0 #5c2e0b, 0 4px 5px rgba(0,0,0,0.3); }
        .wood-sign::before {
            content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(255,255,255,0.4); border-radius: 10px; pointer-events: none;
        }
        
        .letter-char { font-size: 2.5rem; font-weight: bold; color: #3e200a; line-height: 1; font-family: 'Mali', cursive; text-shadow: 1px 1px 0 rgba(255,255,255,0.5);}
        .letter-word { font-size: 0.85rem; color: #5c3317; font-weight: 700; margin-top: 4px; background: rgba(255,255,255,0.6); padding: 0 6px; border-radius: 10px;}

        #basket-area {
            position: absolute;
            bottom: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 200px;
            z-index: 10;
        }
        
        /* Layering for basket to make letters look inside */
        .basket-back {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://static.vecteezy.com/system/resources/thumbnails/009/660/156/small/watercolor-wicker-basket-illustration-png.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
            z-index: 10;
            pointer-events: none;
        }
        .basket-front {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%; /* Cover lower half */
            background-image: url('https://static.vecteezy.com/system/resources/thumbnails/009/660/156/small/watercolor-wicker-basket-illustration-png.png');
            background-size: 100% 166.66%; /* Stretch back to original scale relative to height */
            background-repeat: no-repeat;
            background-position: bottom center;
            z-index: 30; /* Over letters */
            pointer-events: none;
            /* Using CSS clip-path to only show front part if it was a distinct image, 
               but layering the same image offset is a decent web trick */
            clip-path: polygon(0 50%, 100% 50%, 100% 100%, 0 100%);
        }

        #collected-letters {
            position: absolute;
            bottom: 30%;
            left: 10%;
            width: 80%;
            height: 60%;
            z-index: 20; /* Between back and front basket layers */
            display: flex;
            flex-wrap: wrap-reverse;
            justify-content: center;
            align-content: flex-start;
            pointer-events: none;
        }
        .mini-letter {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4a2810;
            background: #fff8dc;
            border: 2px solid #8B4513;
            border-radius: 8px;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: -5px 2px; /* Overlap slightly */
            box-shadow: 1px 2px 4px rgba(0,0,0,0.2);
            font-family: 'Mali', cursive;
        }

        /* Scenery */
        .cloud { position: absolute; background: white; border-radius: 50px; opacity: 0.8; z-index: 1; pointer-events: none; }
        .cloud::before, .cloud::after { content: ''; position: absolute; background: white; border-radius: 50%; }
        
        .btn-farm {
            background: linear-gradient(180deg, #ffb347 0%, #ff7b00 100%);
            border: 4px solid #fff;
            border-radius: 20px;
            color: white;
            text-shadow: 1px 2px 2px rgba(0,0,0,0.3);
            box-shadow: 0 6px 0 #cc5500, 0 10px 10px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }
        .btn-farm:active { transform: translateY(6px); box-shadow: 0 0 0 #cc5500, 0 4px 4px rgba(0,0,0,0.2); }

        #ar-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999; pointer-events: none; }
        #ar-video { display: none; }
        
        .ar-cursor {
            position: absolute; width: 30px; height: 30px; border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.8); background: rgba(0, 255, 0, 0.4);
            transform: translate(-50%, -50%); z-index: 1000; pointer-events: none; display: none;
            box-shadow: 0 0 10px rgba(0,255,0,0.5);
        }
        
        .sparkle-fx {
            position: absolute; font-size: 3rem; pointer-events: none; z-index: 100;
            animation: sparkle 0.6s ease-out forwards;
        }
        
        /* Message Box */
        #msg-box {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95); border: 4px solid var(--color-wood); border-radius: 20px;
            padding: 10px 30px; font-size: 1.5rem; font-weight: bold; color: #d9480f;
            z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); font-family: 'Mali', cursive;
        }
    </style>
</head>
<body>

    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden bg-gradient-to-b from-[#4fc3f7] via-[#b3e5fc] to-[#8bc34a]">
        
        <!-- Sun & Rays -->
        <div class="absolute top-8 left-12 md:left-24 w-28 h-28 bg-yellow-400 rounded-full shadow-[0_0_80px_rgba(253,224,71,1)] flex items-center justify-center animate-[spin_30s_linear_infinite]">
            <div class="w-40 h-40 absolute bg-yellow-300/30 rounded-full"></div>
            <div class="w-52 h-52 absolute bg-yellow-200/20 rounded-full"></div>
            <div class="w-1.5 h-40 bg-yellow-400 absolute rotate-0 rounded-full"></div>
            <div class="w-1.5 h-40 bg-yellow-400 absolute rotate-45 rounded-full"></div>
            <div class="w-1.5 h-40 bg-yellow-400 absolute rotate-90 rounded-full"></div>
            <div class="w-1.5 h-40 bg-yellow-400 absolute rotate-[135deg] rounded-full"></div>
        </div>

        <!-- Animated Clouds -->
        <div class="cloud w-32 h-10 top-16 left-[10%] opacity-90" style="animation: float 6s ease-in-out infinite;">
            <div class="w-12 h-12 -top-6 left-4"></div><div class="w-16 h-16 -top-8 left-10"></div>
        </div>
        <div class="cloud w-48 h-14 top-24 right-[15%] opacity-80" style="animation: float 8s ease-in-out infinite reverse;">
            <div class="w-16 h-16 -top-8 left-6"></div><div class="w-24 h-24 -top-12 left-14"></div>
        </div>
        <div class="cloud w-24 h-8 top-40 left-[40%] opacity-60 scale-75" style="animation: float 7s ease-in-out infinite;">
            <div class="w-10 h-10 -top-5 left-3"></div><div class="w-12 h-12 -top-6 left-8"></div>
        </div>

        <!-- Distant Mountains -->
        <div class="absolute bottom-[35%] left-[-15%] w-[70%] h-[40%] bg-[#81c784] rounded-t-[100%] opacity-60"></div>
        <div class="absolute bottom-[35%] right-[-15%] w-[80%] h-[45%] bg-[#66bb6a] rounded-t-[100%] opacity-60"></div>

        <!-- Far Left Hill -->
        <div class="absolute bottom-[20%] left-[-5%] w-[65%] h-[40%] bg-[#7cb342] rounded-t-[100%] border-t-[8px] border-[#8bc34a]/30 shadow-[inset_0_-20px_0_rgba(0,0,0,0.05)]"></div>
        
        <!-- Red Barn & Silo -->
        <div class="absolute bottom-[40%] left-[15%] md:left-[25%] scale-75 md:scale-90 z-10 origin-bottom">
            <div class="w-32 h-24 bg-[#c62828] border-2 border-[#b71c1c] shadow-lg relative rounded-b-md">
                <div class="absolute -top-12 -left-2 w-36 h-12 bg-[#b71c1c] border-b-4 border-[#880e4f]" style="clip-path: polygon(50% 0%, 0% 100%, 100% 100%);"></div>
                <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-12 h-14 bg-white border-4 border-[#b71c1c] flex justify-center items-center overflow-hidden">
                    <div class="w-full h-1 bg-[#b71c1c] absolute rotate-45 scale-150"></div>
                    <div class="w-full h-1 bg-[#b71c1c] absolute -rotate-45 scale-150"></div>
                </div>
                <div class="absolute top-3 left-1/2 transform -translate-x-1/2 w-6 h-6 bg-[#212121] border-2 border-white rounded-full flex justify-center items-center">
                    <div class="w-full h-0.5 bg-white absolute"></div><div class="w-0.5 h-full bg-white absolute"></div>
                </div>
            </div>
            <div class="absolute bottom-0 -right-12 w-14 h-32 bg-[#e0e0e0] border-2 border-[#bdbdbd] rounded-t-full shadow-lg">
                <div class="w-full h-14 bg-[#9e9e9e] rounded-t-full absolute top-0 opacity-50"></div>
            </div>
        </div>

        <!-- Middle Right Hill -->
        <div class="absolute bottom-[10%] right-[-10%] w-[70%] h-[45%] bg-[#8bc34a] rounded-t-[100%] border-t-[8px] border-[#9ccc65]/40 shadow-[inset_0_-20px_0_rgba(0,0,0,0.05)] z-10"></div>

        <!-- Windmill -->
        <div class="absolute bottom-[35%] right-[20%] md:right-[25%] scale-50 md:scale-75 z-10 origin-bottom">
            <div class="w-16 h-32 bg-[#ffcc80] border-2 border-[#ef6c00] mx-auto" style="clip-path: polygon(25% 0, 75% 0, 100% 100%, 0 100%);"></div>
            <div class="w-16 h-4 bg-[#ef6c00] absolute top-0 left-1/2 -translate-x-1/2 rounded-t-full"></div>
            <div class="absolute top-2 left-1/2 transform -translate-x-1/2 w-4 h-4 bg-[#5d4037] rounded-full z-20"></div>
            <div class="absolute top-2 left-1/2 transform -translate-x-1/2 w-40 h-40 origin-center animate-[spin_10s_linear_infinite] z-10">
                <div class="absolute top-0 left-1/2 w-2 h-20 bg-[#f5f5f5] border-2 border-[#9e9e9e] -translate-x-1/2 origin-bottom shadow-md rounded-t-md"></div>
                <div class="absolute top-1/2 left-1/2 w-20 h-2 bg-[#f5f5f5] border-2 border-[#9e9e9e] translate-y-[-50%] origin-left shadow-md rounded-r-md"></div>
                <div class="absolute bottom-0 left-1/2 w-2 h-20 bg-[#f5f5f5] border-2 border-[#9e9e9e] -translate-x-1/2 origin-top shadow-md rounded-b-md"></div>
                <div class="absolute top-1/2 right-1/2 w-20 h-2 bg-[#f5f5f5] border-2 border-[#9e9e9e] translate-y-[-50%] origin-right shadow-md rounded-l-md"></div>
            </div>
        </div>

        <!-- Foreground Hill (Covers bottom) -->
        <div class="absolute bottom-[-15%] md:bottom-[-20%] left-[-10%] w-[120%] h-[45%] md:h-[50%] bg-[#9ccc65] rounded-t-[50%] border-t-[10px] border-[#aed581]/50 shadow-[inset_0_30px_30px_rgba(255,255,255,0.2)] z-20">
            <!-- Trees & Bushes -->
            <div class="absolute top-[8%] left-[15%] md:left-[20%] scale-75 md:scale-100">
                <div class="w-6 h-16 bg-[#795548] mx-auto rounded-sm border-l-2 border-[#5d4037]"></div>
                <div class="w-24 h-24 bg-[#43a047] rounded-full absolute -top-16 -left-9 shadow-inner opacity-95 border-b-4 border-[#2e7d32]"></div>
                <div class="w-16 h-16 bg-[#4caf50] rounded-full absolute -top-12 -left-1 shadow-inner"></div>
            </div>
            <div class="absolute top-[5%] right-[20%] scale-50 md:scale-75">
                <div class="w-6 h-14 bg-[#795548] mx-auto rounded-sm border-l-2 border-[#5d4037]"></div>
                <div class="w-20 h-20 bg-[#43a047] rounded-full absolute -top-12 -left-7 shadow-inner opacity-95 border-b-4 border-[#2e7d32]"></div>
            </div>
            <div class="absolute top-[18%] right-[35%]">
                <div class="w-16 h-10 bg-[#388e3c] rounded-t-full border-b-4 border-[#1b5e20] shadow-sm"></div>
            </div>
            <!-- Flowers -->
            <div class="absolute top-[15%] left-[30%] w-2.5 h-2.5 bg-pink-400 rounded-full shadow-[12px_6px_0_#f48fb1,24px_-2px_0_#ff4081]"></div>
            <div class="absolute top-[22%] right-[40%] w-2 h-2 bg-yellow-400 rounded-full shadow-[15px_10px_0_#ffb300,5px_15px_0_#ffca28,25px_5px_0_#ffb300]"></div>
        </div>

        <!-- Wooden Fence -->
        <div class="absolute bottom-[2%] w-full h-16 z-30 flex justify-center opacity-90 pointer-events-none">
            <div class="w-full max-w-5xl h-full relative">
                <div class="absolute top-2 w-full h-3 bg-[#8d6e63] border-y border-[#5d4037] shadow-sm"></div>
                <div class="absolute top-8 w-full h-3 bg-[#8d6e63] border-y border-[#5d4037] shadow-sm"></div>
                <div class="flex justify-between w-full h-full absolute inset-0 px-2 md:px-10">
                    <div class="w-5 h-16 bg-[#6d4c41] rounded-t-md shadow-md border-r-2 border-[#4e342e]"></div>
                    <div class="w-5 h-16 bg-[#6d4c41] rounded-t-md shadow-md border-r-2 border-[#4e342e]"></div>
                    <div class="w-5 h-16 bg-[#6d4c41] rounded-t-md shadow-md border-r-2 border-[#4e342e] hidden md:block"></div>
                    <div class="w-5 h-16 bg-[#6d4c41] rounded-t-md shadow-md border-r-2 border-[#4e342e]"></div>
                    <div class="w-5 h-16 bg-[#6d4c41] rounded-t-md shadow-md border-r-2 border-[#4e342e]"></div>
                    <div class="w-5 h-16 bg-[#6d4c41] rounded-t-md shadow-md border-r-2 border-[#4e342e] hidden md:block"></div>
                    <div class="w-5 h-16 bg-[#6d4c41] rounded-t-md shadow-md border-r-2 border-[#4e342e]"></div>
                    <div class="w-5 h-16 bg-[#6d4c41] rounded-t-md shadow-md border-r-2 border-[#4e342e]"></div>
                </div>
            </div>
        </div>
        
        <!-- Sunlight Overlay Effect -->
        <div class="absolute inset-0 bg-yellow-100/10 mix-blend-overlay"></div>
    </div>

    <div id="screen-menu" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black/40 backdrop-blur-sm">
        <div class="bg-white/95 p-8 rounded-3xl border-8 border-[#8B4513] shadow-2xl max-w-md w-[90%] text-center">
            <h1 class="text-4xl md:text-5xl font-bold font-mali text-green-700 mb-2 drop-shadow-md">🌾 ฟาร์มพยัญชนะไทย 🌾</h1>
            <p class="text-xl font-semibold text-orange-600 mb-8">ก - ฮ</p>
            
            <p class="text-gray-600 mb-6">เลือกโหมดการเล่น:</p>
            
            <div class="space-y-4">
                <button onclick="startGame('touch')" class="btn-farm w-full py-4 text-2xl font-bold flex items-center justify-center gap-3">
                    👆 / 🖱️ แตะ & เมาส์
                </button>
                <button onclick="startGame('ar')" id="btn-ar" class="btn-farm w-full py-4 text-2xl font-bold flex items-center justify-center gap-3 !bg-gradient-to-b !from-green-400 !to-green-600 !shadow-[0_6px_0_#166534,0_10px_10px_rgba(0,0,0,0.2)]">
                    📷 AR จีบนิ้วหยิบ
                </button>
            </div>
            
            <p class="mt-6 text-sm text-gray-500">แนะนำสำหรับเด็กและผู้สูงอายุ<br>ออกแบบมาเพื่อพัฒนาการเรียนรู้</p>
        </div>
    </div>

    <div id="screen-game" class="fixed inset-0 z-10 hidden">
        
        <!-- Top HUD -->
        <div class="absolute top-2 left-0 w-full flex flex-row justify-between px-2 md:px-6 z-40 items-start pointer-events-none">
            <!-- Timer & Score -->
            <div class="flex flex-col gap-2 scale-90 md:scale-100 origin-top-left">
                <div class="bg-white/95 border-4 border-green-600 rounded-2xl px-3 py-2 shadow-lg flex items-center gap-2">
                    
                    <span id="ui-timer" class="text-3xl md:text-4xl font-bold text-gray-800 font-mali w-[80px] text-center">01:00</span>
                </div>
                <div class="bg-white/95 border-4 border-yellow-500 rounded-2xl px-3 py-1 shadow-lg flex items-center gap-2">
                    <span class="text-2xl drop-shadow-md">⭐</span>
                    <span id="ui-score" class="text-2xl font-bold text-gray-800 w-[60px] text-center">0</span>
                </div>
            </div>

            <!-- Mission Card (Wood Sign Style) -->
            <div class="wood-board rounded-2xl p-2 md:p-3 shadow-xl max-w-[150px] md:max-w-[200px] text-center transform rotate-3 relative mt-4 scale-90 md:scale-100 origin-top-right">
                <div class="sign-rope left-[20%]"></div>
                <div class="sign-rope right-[20%]"></div>
                <div class="text-xs md:text-sm font-bold text-white mb-1 drop-shadow-md">🎯 ตามหา</div>
                <div class="bg-[#fff8dc] rounded-xl border-2 border-dashed border-[#8B4513] p-2 flex flex-col items-center justify-center min-w-[80px]">
                    <div id="mission-letter" class="text-4xl md:text-5xl font-bold text-green-800 font-mali leading-none mb-1">ก</div>
                    <div id="mission-word" class="text-sm md:text-lg font-bold text-gray-800">กอ ไก่</div>
                </div>
            </div>
        </div>

        <!-- Play Area for Letters -->
        <div id="play-area" class="absolute top-[20%] left-0 w-full h-[55%] z-20"></div>

        <!-- The Basket -->
        <div id="basket-area">
            <div class="basket-back"></div>
            <div id="collected-letters"></div>
            <div class="basket-front"></div>
        </div>

        <!-- Message Box -->
        <div id="msg-box">ลองหาตัว ก ดูอีกครั้งนะ 🌱</div>

    </div>

    <div id="screen-result" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-md overflow-y-auto flex items-center justify-center p-4">
        
        <div id="result-capture-area" class="bg-[#fdf6e3] p-6 md:p-8 rounded-3xl border-8 border-[#8B4513] shadow-2xl max-w-lg w-full relative overflow-hidden">
            <!-- Background pattern for result -->
            <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#8B4513 2px, transparent 2px); background-size: 30px 30px;"></div>
            
            <div class="relative z-10 text-center">
                <h2 class="text-4xl font-bold font-mali text-red-600 mb-2 drop-shadow-sm">🌾 หมดเวลาแล้ว! 🌾</h2>
                <h3 class="text-xl font-bold text-gray-700 mb-6">ฟาร์มพยัญชนะไทย ก-ฮ โครงการห้องสมุดแม่ลาน</h3>
                
                <div class="bg-white/80 p-4 rounded-2xl border-4 border-green-500 mb-4 inline-block w-full">
                    <div class="text-gray-600 font-bold mb-1 text-left">👤 ชื่อผู้เล่น:</div>
                    <input type="text" id="player-name" placeholder="พิมพ์ชื่อน้องๆ ที่นี่..." class="w-full text-2xl font-bold text-center border-b-2 border-gray-300 focus:outline-none focus:border-green-500 bg-transparent py-2 font-mali" maxlength="20">
                </div>

                <div class="flex justify-center gap-4 mb-6">
                    <div class="bg-yellow-100 p-4 rounded-2xl border-2 border-yellow-400 w-1/2">
                        <div class="text-gray-600 font-bold">⭐ คะแนน</div>
                        <div id="final-score" class="text-4xl font-bold text-yellow-600 font-mali mt-1">120</div>
                    </div>
                    <div class="bg-blue-100 p-4 rounded-2xl border-2 border-blue-400 w-1/2">
                        <div class="text-gray-600 font-bold">🔤 เก็บได้</div>
                        <div id="final-count" class="text-4xl font-bold text-blue-600 font-mali mt-1">12 ตัว</div>
                    </div>

                <!-- Mini Basket Result Display -->
                <div class="bg-green-100/50 p-4 rounded-2xl border-2 border-green-300 mb-6 relative h-40 flex items-end justify-center">
                    <img src="https://static.vecteezy.com/system/resources/thumbnails/009/660/156/small/watercolor-wicker-basket-illustration-png.png" class="absolute bottom-2 w-32 z-10 opacity-40">
                    <div id="result-basket-content" class="relative z-20 flex flex-wrap justify-center gap-1 w-full h-full content-start pt-2 overflow-hidden">
                        <!-- Filled via JS -->
                    </div>

            </div>
            
            <!-- Buttons (Not captured in screenshot if hidden temporarily) -->
            <div id="result-buttons" class="relative z-20 flex flex-col gap-3 mt-4">
                <button onclick="captureScore()" class="btn-farm w-full py-3 text-xl font-bold flex items-center justify-center gap-2 !bg-gradient-to-b !from-blue-400 !to-blue-600 !shadow-[0_6px_0_#1e3a8a,0_10px_10px_rgba(0,0,0,0.2)]">
                    📸 แคปภาพคะแนน
                </button>
                <button onclick="resetGame()" class="btn-farm w-full py-3 text-xl font-bold flex items-center justify-center gap-2">
                    🔄 เล่นใหม่อีกครั้ง
                </button>
            </div>
        </div>
    </div>

    <video id="ar-video" autoplay playsinline></video>
    <canvas id="ar-canvas"></canvas>
    <div id="ar-cursor" class="ar-cursor"></div>

    <script>
        const thaiAlphabet = [
            { l: 'ก', w: 'ไก่', n: 'กอ ไก่' }, { l: 'ข', w: 'ไข่', n: 'ขอ ไข่' }, { l: 'ฃ', w: 'ขวด', n: 'ขอ ขวด' },
            { l: 'ค', w: 'ควาย', n: 'คอ ควาย' }, { l: 'ฅ', w: 'คน', n: 'คอ คน' }, { l: 'ฆ', w: 'ระฆัง', n: 'คอ ระฆัง' },
            { l: 'ง', w: 'งู', n: 'งอ งู' }, { l: 'จ', w: 'จาน', n: 'จอ จาน' }, { l: 'ฉ', w: 'ฉิ่ง', n: 'ฉอ ฉิ่ง' },
            { l: 'ช', w: 'ช้าง', n: 'ชอ ช้าง' }, { l: 'ซ', w: 'โซ่', n: 'ซอ โซ่' }, { l: 'ฌ', w: 'เฌอ', n: 'ชอ เฌอ' },
            { l: 'ญ', w: 'หญิง', n: 'ยอ หญิง' }, { l: 'ฎ', w: 'ชฎา', n: 'ดอ ชฎา' }, { l: 'ฏ', w: 'ปฏัก', n: 'ตอ ปฏัก' },
            { l: 'ฐ', w: 'ฐาน', n: 'ถอ ฐาน' }, { l: 'ฑ', w: 'มณโฑ', n: 'ทอ มณโฑ' }, { l: 'ฒ', w: 'ผู้เฒ่า', n: 'ทอ ผู้เฒ่า' },
            { l: 'ณ', w: 'เณร', n: 'นอ เณร' }, { l: 'ด', w: 'เด็ก', n: 'ดอ เด็ก' }, { l: 'ต', w: 'เต่า', n: 'ตอ เต่า' },
            { l: 'ถ', w: 'ถุง', n: 'ถอ ถุง' }, { l: 'ท', w: 'ทหาร', n: 'ทอ ทหาร' }, { l: 'ธ', w: 'ธง', n: 'ทอ ธง' },
            { l: 'น', w: 'หนู', n: 'นอ หนู' }, { l: 'บ', w: 'ใบไม้', n: 'บอ ใบไม้' }, { l: 'ป', w: 'ปลา', n: 'ปอ ปลา' },
            { l: 'ผ', w: 'ผึ้ง', n: 'ผอ ผึ้ง' }, { l: 'ฝ', w: 'ฝา', n: 'ฝอ ฝา' }, { l: 'พ', w: 'พาน', n: 'พอ พาน' },
            { l: 'ฟ', w: 'ฟัน', n: 'ฟอ ฟัน' }, { l: 'ภ', w: 'สำเภา', n: 'พอ สำเภา' }, { l: 'ม', w: 'ม้า', n: 'มอ ม้า' },
            { l: 'ย', w: 'ยักษ์', n: 'ยอ ยักษ์' }, { l: 'ร', w: 'เรือ', n: 'รอ เรือ' }, { l: 'ล', w: 'ลิง', n: 'ลอ ลิง' },
            { l: 'ว', w: 'แหวน', n: 'วอ แหวน' }, { l: 'ศ', w: 'ศาลา', n: 'สอ ศาลา' }, { l: 'ษ', w: 'ฤๅษี', n: 'สอ ฤๅษี' },
            { l: 'ส', w: 'เสือ', n: 'สอ เสือ' }, { l: 'ห', w: 'หีบ', n: 'หอ หีบ' }, { l: 'ฬ', w: 'จุฬา', n: 'ลอ จุฬา' },
            { l: 'อ', w: 'อ่าง', n: 'ออ อ่าง' }, { l: 'ฮ', w: 'นกฮูก', n: 'ฮอ นกฮูก' }
        ];

        // Audio System (Web Audio API & Web Speech)
        let audioCtx;
        let bgmOscillators = [];
        let isBgmPlaying = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Simple procedural BGM (Pentatonic happy tune loop)
        function startBGM() {
            if(isBgmPlaying) return;
            initAudio();
            isBgmPlaying = true;
            
            const notes = [392.00, 440.00, 493.88, 587.33, 659.25]; // G4, A4, B4, D5, E5
            let noteIdx = 0;
            
            function playNote() {
                if(!isBgmPlaying) return;
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.value = notes[noteIdx % notes.length] / 2; // Lower octave for BGM
                
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.1);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
                
                noteIdx = Math.floor(Math.random() * notes.length);
                setTimeout(playNote, 500);
            }
            playNote();
        }

        function stopBGM() {
            isBgmPlaying = false;
        }

        function playSFX(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'ping') { // Success
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'bloop') { // Wrong
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'tick') { // Time warning
                osc.type = 'square';
                osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            }
        }

        const praises = ["เก่งมาก!", "เยี่ยมเลย!", "สุดยอด!"];
        function speakThai(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop current speech
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        let currentMode = 'touch'; // 'touch' or 'ar'
        let timeRemaining = 60;
        let score = 0;
        let collectedCount = 0;
        let collectedLettersList = [];
        let currentMission = null;
        let gameTimer = null;
        let isGameRunning = false;
        let activeSigns = [];
        
        let animationFrameId = null;

        // Dragging State
        let draggedElement = null;
        let offsetX = 0;
        let offsetY = 0;
        let startX = 0;
        let startY = 0;

        // AR State
        let camera = null;
        let hands = null;
        let isARPinching = false;
        let arPinchedElement = null;
        const arCursor = document.getElementById('ar-cursor');
        const canvasCtx = document.getElementById('ar-canvas').getContext('2d');

        // UI Elements
        const playArea = document.getElementById('play-area');
        const basketArea = document.getElementById('basket-area');
        const collectedLettersDiv = document.getElementById('collected-letters');
        const msgBox = document.getElementById('msg-box');
        
        function startGame(mode) {
            initAudio();
            startBGM();
            currentMode = mode;
            
            document.getElementById('screen-menu').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            
            if (mode === 'ar') {
                setupAR();
            } else {
                document.getElementById('ar-canvas').style.display = 'none';
            }

            resetGameState();
            isGameRunning = true;
            gameTimer = setInterval(updateTimer, 1000);
            
            setNewMission();
            spawnLetters();
            
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            moveLettersLoop();
        }

        function resetGameState() {
            timeRemaining = 60;
            score = 0;
            collectedCount = 0;
            collectedLettersList = [];
            activeSigns = [];
            updateUI();
            playArea.innerHTML = '';
            collectedLettersDiv.innerHTML = '';
            document.getElementById('result-basket-content').innerHTML = '';
            document.getElementById('player-name').value = '';
            document.getElementById('ui-timer').style.color = '#1f2937'; // Reset text-gray-800
        }

        function moveLettersLoop() {
            if(!isGameRunning) return;
            
            activeSigns.forEach(sign => {
                // Skip if currently grabbed
                if(sign === draggedElement || sign === arPinchedElement) return;

                let px = parseFloat(sign.dataset.px);
                let py = parseFloat(sign.dataset.py);
                let vx = parseFloat(sign.dataset.vx);
                let vy = parseFloat(sign.dataset.vy);

                px += vx;
                py += vy;

                // Bounce off logical boundaries (percentages)
                if(px <= 2 || px >= 85) { vx *= -1; px = px <= 2 ? 2.1 : 84.9; }
                if(py <= 15 || py >= 75) { vy *= -1; py = py <= 15 ? 15.1 : 74.9; } // Avoid top HUD and bottom basket

                sign.dataset.px = px;
                sign.dataset.py = py;
                sign.dataset.vx = vx;
                sign.dataset.vy = vy;

                sign.style.left = `${px}%`;
                sign.style.top = `${py}%`;
            });
            
            animationFrameId = requestAnimationFrame(moveLettersLoop);
        }

        function updateUI() {
            const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const s = (timeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('ui-timer').innerText = `${m}:${s}`;
            document.getElementById('ui-score').innerText = score;
        }

        function updateTimer() {
            if(timeRemaining > 0) {
                timeRemaining--;
                updateUI();
                
                if(timeRemaining === 10) {
                    document.getElementById('ui-timer').style.color = '#ef4444'; // Red
                }
                if(timeRemaining <= 10 && timeRemaining > 0) {
                    playSFX('tick');
                }
                
                // Periodically refresh board if running out of letters
                if(timeRemaining % 5 === 0 && activeSigns.length < 3) {
                    spawnLetters();
                }

            } else {
                endGame();
            }
        }

        function setNewMission() {
            // Pick a random letter from the pool
            currentMission = thaiAlphabet[Math.floor(Math.random() * thaiAlphabet.length)];
            document.getElementById('mission-letter').innerText = currentMission.l;
            document.getElementById('mission-word').innerText = currentMission.n;
            
            // Speak mission
            speakThai(`ตามหา ${currentMission.n}`);
        }

        function spawnLetters() {
            if (!isGameRunning) return;
            
            // Clear old safely
            activeSigns.forEach(s => { if(s.parentNode) s.parentNode.removeChild(s); });
            activeSigns = [];
            
            // 1. Guarantee the mission letter is included
            let spawnList = [currentMission];
            
            // 2. Add random letters (allow duplicates for mixing)
            let totalLetters = 5 + Math.floor(Math.random() * 2); // 5 to 6 letters total
            for(let i = 1; i < totalLetters; i++) {
                let randomLet = thaiAlphabet[Math.floor(Math.random() * thaiAlphabet.length)];
                spawnList.push(randomLet);
            }
            
            // Shuffle
            spawnList.sort(() => Math.random() - 0.5);

            spawnList.forEach(item => {
                createWoodSign(item);
            });
        }

        function createWoodSign(item) {
            const sign = document.createElement('div');
            sign.className = 'wood-sign pop-in'; // Removed 'floating' CSS animation, handled by JS
            sign.innerHTML = `
                <div class="letter-char">${item.l}</div>
                <div class="letter-word">${item.w}</div>
            `;
            
            // Random position (avoid edges)
            const x = 5 + Math.random() * 75; 
            const y = 20 + Math.random() * 50;
            
            // Random velocity (speed)
            const speedBase = window.innerWidth < 768 ? 0.08 : 0.05; // Slightly faster on mobile due to smaller screen %
            const vx = (Math.random() - 0.5) * speedBase;
            const vy = (Math.random() - 0.5) * speedBase;
            
            sign.dataset.px = x;
            sign.dataset.py = y;
            sign.dataset.vx = vx;
            sign.dataset.vy = vy;
            
            sign.style.left = `${x}%`;
            sign.style.top = `${y}%`;
            sign.dataset.letter = item.l;
            sign.dataset.name = item.n;

            // Touch / Mouse Events
            sign.addEventListener('pointerdown', handlePointerDown);
            
            playArea.appendChild(sign);
            activeSigns.push(sign);
        }

        // Pointer Events (Mouse/Touch)
        function handlePointerDown(e) {
            if (!isGameRunning) return;
            draggedElement = e.currentTarget;
            draggedElement.style.zIndex = '100';
            draggedElement.style.transition = 'none'; // Disable transition while dragging
            
            const rect = draggedElement.getBoundingClientRect();
            
            // Store logical percentage position in case of wrong drop
            draggedElement.dataset.grabPx = draggedElement.dataset.px;
            draggedElement.dataset.grabPy = draggedElement.dataset.py;
            
            // Calculate offset relative to parent
            const parentRect = playArea.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            document.addEventListener('pointermove', handlePointerMove);
            document.addEventListener('pointerup', handlePointerUp);
            
            // Prevent default touch behavior
            e.preventDefault();
        }

        function handlePointerMove(e) {
            if (!draggedElement) return;
            const parentRect = playArea.getBoundingClientRect();
            
            let newX = e.clientX - parentRect.left - offsetX;
            let newY = e.clientY - parentRect.top - offsetY;
            
            draggedElement.style.left = `${newX}px`;
            draggedElement.style.top = `${newY}px`;
        }

        function handlePointerUp(e) {
            if (!draggedElement) return;
            document.removeEventListener('pointermove', handlePointerMove);
            document.removeEventListener('pointerup', handlePointerUp);
            
            draggedElement.style.transition = ''; // Restore transitions
            checkDrop(draggedElement);
            draggedElement = null;
        }

        function checkDrop(element) {
            const elRect = element.getBoundingClientRect();
            const basketRect = basketArea.getBoundingClientRect();
            
            // Simple AABB collision (checking if center of sign is inside basket area)
            const elCenterX = elRect.left + elRect.width / 2;
            const elCenterY = elRect.top + elRect.height / 2;

            const inBasketX = elCenterX > basketRect.left && elCenterX < basketRect.right;
            const inBasketY = elCenterY > basketRect.top && elCenterY < basketRect.bottom;

            if (inBasketX && inBasketY) {
                // Dropped in basket
                if (element.dataset.letter === currentMission.l) {
                    successDrop(element);
                } else {
                    wrongDrop(element);
                }
            } else {
                // Dropped outside, return to logical floating position
                element.style.left = `${element.dataset.grabPx}%`;
                element.style.top = `${element.dataset.grabPy}%`;
                element.dataset.px = element.dataset.grabPx;
                element.dataset.py = element.dataset.grabPy;
                element.style.zIndex = '20';
            }
        }

        function showMessage(text) {
            msgBox.innerText = text;
            msgBox.style.opacity = '1';
            setTimeout(() => { msgBox.style.opacity = '0'; }, 2000);
        }

        function wrongDrop(element) {
            playSFX('bloop');
            showMessage(`ลองหาตัว ${currentMission.l} ดูอีกครั้งนะ 🌱`);
            
            // Animate back
            element.style.transition = 'all 0.3s ease';
            element.style.left = `${element.dataset.grabPx}%`;
            element.style.top = `${element.dataset.grabPy}%`;
            element.dataset.px = element.dataset.grabPx;
            element.dataset.py = element.dataset.grabPy;
            
            setTimeout(() => {
                element.style.transition = 'filter 0.2s, opacity 0.2s'; // reset to default
                element.style.zIndex = '20';
            }, 300);
        }

        function successDrop(element) {
            playSFX('ping');
            const praise = praises[Math.floor(Math.random() * praises.length)];
            speakThai(`${praise} ${element.dataset.name}`);
            
            // Visual Effects
            createSparkle(element);
            basketArea.classList.add('bounce');
            setTimeout(() => basketArea.classList.remove('bounce'), 300);

            // Update Score & Data
            score += 10;
            collectedCount++;
            collectedLettersList.push(element.dataset.letter);
            updateUI();

            // Animate into basket logic
            element.style.transition = 'all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            element.style.transform = 'scale(0.3) rotate(360deg)';
            element.style.opacity = '0';
            
            // Remove from active array immediately so loop ignores it
            activeSigns = activeSigns.filter(s => s !== element);
            
            setTimeout(() => {
                if(element.parentNode) element.parentNode.removeChild(element);
                addLetterToBasketVisual(element.dataset.letter);
                
                // Next Mission and Refresh Board Completely
                setNewMission();
                spawnLetters(); // Always refresh to mix it up and show new target
            }, 400);
        }

        function createSparkle(element) {
            const rect = element.getBoundingClientRect();
            const sparkle = document.createElement('div');
            sparkle.innerHTML = '✨';
            sparkle.className = 'sparkle-fx';
            sparkle.style.left = `${rect.left + rect.width/2 - 24}px`;
            sparkle.style.top = `${rect.top + rect.height/2 - 24}px`;
            document.body.appendChild(sparkle);
            setTimeout(() => { if(sparkle.parentNode) sparkle.parentNode.removeChild(sparkle); }, 600);
        }

        function addLetterToBasketVisual(letterStr) {
            // Add to main game basket
            const mini = document.createElement('div');
            mini.className = 'mini-letter pop-in';
            mini.innerText = letterStr;
            
            // Random slight rotation for natural look
            const rot = (Math.random() - 0.5) * 30;
            mini.style.transform = `rotate(${rot}deg)`;
            
            collectedLettersDiv.appendChild(mini);
            
            // Prevent overflowing visually by limiting DOM nodes shown if too many
            if(collectedLettersDiv.children.length > 20) {
                collectedLettersDiv.removeChild(collectedLettersDiv.firstChild);
            }
        }

        function endGame() {
            isGameRunning = false;
            clearInterval(gameTimer);
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            stopBGM();
            speakThai("หมดเวลาแล้วค่ะ");
            
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            
            document.getElementById('final-score').innerText = `${score}`;
            document.getElementById('final-count').innerText = `${collectedCount} ตัว`;
            
            // Populate result basket
            const resBasket = document.getElementById('result-basket-content');
            resBasket.innerHTML = '';
            collectedLettersList.forEach(l => {
                const m = document.createElement('div');
                m.className = 'mini-letter';
                m.style.transform = `rotate(${(Math.random() - 0.5)*30}deg)`;
                m.innerText = l;
                resBasket.appendChild(m);
            });
            
            // Stop Camera if AR
            if(camera) {
                camera.stop();
                document.getElementById('ar-canvas').style.display = 'none';
            }
        }

        function resetGame() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-menu').classList.remove('hidden');
        }

        function captureScore() {
            // Hide buttons before capture
            const btns = document.getElementById('result-buttons');
            const playerNameInput = document.getElementById('player-name');
            const nameVal = playerNameInput.value || "ผู้เล่นไม่ประสงค์ออกนาม";
            
            // Replace input with text temporarily for clean render
            const nameDisplay = document.createElement('div');
            nameDisplay.className = "w-full text-2xl font-bold text-center py-2 font-mali text-gray-800 border-b-2 border-transparent";
            nameDisplay.innerText = nameVal;
            playerNameInput.parentNode.insertBefore(nameDisplay, playerNameInput);
            playerNameInput.style.display = 'none';

            btns.style.display = 'none';
            
            const target = document.getElementById('result-capture-area');
            
            html2canvas(target, { backgroundColor: null, scale: 2 }).then(canvas => {
                // Restore UI
                btns.style.display = 'flex';
                playerNameInput.style.display = 'block';
                nameDisplay.parentNode.removeChild(nameDisplay);

                // Download
                const link = document.createElement('a');
                link.download = `คะแนน-ฟาร์มพยัญชนะ-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        function setupAR() {
            const videoElement = document.getElementById('ar-video');
            const canvasElement = document.getElementById('ar-canvas');
            canvasElement.style.display = 'block';
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;

            showMessage("กำลังโหลดระบบกล้อง AR...");

            try {
                if(!hands) {
                    hands = new Hands({locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                    }});
                    
                    hands.setOptions({
                        maxNumHands: 1,
                        modelComplexity: 1,
                        minDetectionConfidence: 0.6,
                        minTrackingConfidence: 0.6
                    });
                    
                    hands.onResults(onARResults);
                }

                if(!camera) {
                    camera = new Camera(videoElement, {
                        onFrame: async () => {
                            await hands.send({image: videoElement});
                        },
                        width: 640,
                        height: 480,
                        facingMode: 'user'
                    });
                }
                camera.start().catch(e => {
                    arErrorFallback();
                });
            } catch(e) {
                arErrorFallback();
            }
        }

        function arErrorFallback() {
            alert("📷 ไม่สามารถเปิดใช้งานกล้อง หรือเบราว์เซอร์ไม่รองรับ AR\nระบบจะสลับไปใช้โหมด 'แตะหน้าจอ' อัตโนมัติ");
            currentMode = 'touch';
            document.getElementById('ar-canvas').style.display = 'none';
            arCursor.style.display = 'none';
        }

        function onARResults(results) {
            if (!isGameRunning || currentMode !== 'ar') return;
            
            const canvasElement = document.getElementById('ar-canvas');
            const ctx = canvasElement.getContext('2d');
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Draw hand wireframe lightly
                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: 'rgba(255, 255, 255, 0.4)', lineWidth: 2});
                
                // Thumb tip (4) and Index tip (8)
                const thumb = landmarks[4];
                const index = landmarks[8];
                
                // Convert normalized coords to screen space (Handle Mirroring 1-x)
                const screenX = (1 - index.x) * window.innerWidth;
                const screenY = index.y * window.innerHeight;
                
                // Update Cursor UI
                arCursor.style.display = 'block';
                arCursor.style.left = `${screenX}px`;
                arCursor.style.top = `${screenY}px`;

                // Calculate Pinch Distance (3D approx via x,y,z)
                const dist = Math.sqrt(Math.pow(thumb.x - index.x, 2) + Math.pow(thumb.y - index.y, 2) + Math.pow(thumb.z - index.z, 2));
                const PINCH_THRESHOLD = 0.05; // Adjustable

                if (dist < PINCH_THRESHOLD) {
                    // Pinching
                    arCursor.style.background = 'rgba(255, 165, 0, 0.6)'; // Orange active
                    arCursor.style.borderColor = 'yellow';
                    
                    if (!isARPinching) {
                        // Just Started Pinching -> Try to grab
                        isARPinching = true;
                        tryGrabAR(screenX, screenY);
                    } else if (arPinchedElement) {
                        // Continue Dragging
                        moveGrabbedAR(screenX, screenY);
                    }
                } else {
                    // Released
                    arCursor.style.background = 'rgba(0, 255, 0, 0.4)';
                    arCursor.style.borderColor = 'rgba(255,255,255,0.8)';
                    
                    if (isARPinching) {
                        isARPinching = false;
                        if (arPinchedElement) {
                            releaseGrabbedAR();
                        }
                    }
                }
            } else {
                arCursor.style.display = 'none';
                if(isARPinching && arPinchedElement) {
                    isARPinching = false;
                    releaseGrabbedAR();
                }
            }
        }

        function tryGrabAR(x, y) {
            // Check intersection with any active sign
            for (let i = activeSigns.length - 1; i >= 0; i--) {
                const sign = activeSigns[i];
                const rect = sign.getBoundingClientRect();
                
                // Expand hitbox slightly for AR ease
                const padding = 25; 
                if (x >= rect.left - padding && x <= rect.right + padding &&
                    y >= rect.top - padding && y <= rect.bottom + padding) {
                    
                    arPinchedElement = sign;
                    arPinchedElement.style.zIndex = '100';
                    arPinchedElement.style.transition = 'none';
                    
                    arPinchedElement.dataset.grabPx = arPinchedElement.dataset.px;
                    arPinchedElement.dataset.grabPy = arPinchedElement.dataset.py;
                    
                    // Center the element on the pinch
                    moveGrabbedAR(x, y);
                    break;
                }
            }
        }

        function moveGrabbedAR(x, y) {
            if(!arPinchedElement) return;
            const parentRect = playArea.getBoundingClientRect();
            // Center the sign on fingers
            const newX = x - parentRect.left - 40; // approx half width
            const newY = y - parentRect.top - 45;  // approx half height
            
            arPinchedElement.style.left = `${newX}px`;
            arPinchedElement.style.top = `${newY}px`;
        }

        function releaseGrabbedAR() {
            if(!arPinchedElement) return;
            const el = arPinchedElement;
            el.style.transition = '';
            arPinchedElement = null; // Clear state immediately
            checkDrop(el);
        }

        // Handle Resize mapping
        window.addEventListener('resize', () => {
            const canvasElement = document.getElementById('ar-canvas');
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        });

    </script>
</body>
