<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมภาษาไทยจากภาพ</title>
    <!-- เรียกใช้ Tailwind CSS เพื่อความสวยงามและตอบสนองได้ดี -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เรียกใช้ฟอนต์ Kanit จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ตั้งค่าฟอนต์หลักและการเลือกข้อความ */
        body {
            font-family: 'Kanit', sans-serif;
            user-select: none; /* ป้องกันการคลุมดำข้อความเวลาแตะหน้าจอรัวๆ */
            background-color: #f0fdf4; /* สีพื้นหลังเขียวมิ้นต์อ่อน สบายตา */
            overflow-x: hidden;
        }

        /* เอฟเฟกต์ปุ่มขนาดใหญ่ */
        .big-btn {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .big-btn:active {
            transform: scale(0.95);
        }

        /* เอฟเฟกต์การสั่นเมื่อตอบผิด */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
            border-color: #ef4444 !important; /* สีแดง */
        }

        /* เอฟเฟกต์เมื่อตอบถูก */
        .correct-animation {
            border-color: #22c55e !important; /* สีเขียว */
            background-color: #dcfce7 !important;
            transform: scale(1.05);
        }

        /* เอฟเฟกต์คะแนนเด้งขึ้น */
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }
        .score-float {
            position: absolute;
            color: #eab308;
            font-weight: bold;
            font-size: 2rem;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
        }

        /* เอฟเฟกต์เวลากระพริบเมื่อใกล้หมดเวลา */
        @keyframes pulse {
            0%, 100% { opacity: 1; color: #ef4444; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        .timer-warning {
            animation: pulse 1s infinite;
            font-weight: bold;
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col relative">

    <!-- ปุ่มควบคุมเสียง (มุมขวาบน) -->
    <!-- จุดที่แก้ไข: ลดขนาดปุ่มลงเล็กน้อย (text-2xl -> text-xl, p-4 -> p-3) -->
    <div class="absolute top-4 right-4 z-50">
        <button id="muteBtn" onclick="toggleMute()" class="bg-white p-3 rounded-full shadow-md text-xl hover:bg-gray-100 focus:outline-none focus:ring-4 ring-blue-300">
            🔊 เสียงเปิด
        </button>
    </div>

    <!-- ================= หน้าแรก (Start Screen) ================= -->
    <div id="startScreen" class="flex-1 flex flex-col items-center justify-center p-6 text-center h-screen">
        <!-- จุดที่แก้ไข: ลดขนาดฟอนต์ 10-15% (text-5xl -> 4xl, md:text-7xl -> 6xl) -->
        <h1 class="text-4xl md:text-6xl font-bold text-blue-600 mb-4">ภาษาไทยจากภาพ</h1>
        <p class="text-xl md:text-2xl text-gray-600 mb-10">เกมเรียนรู้ภาษาไทยสำหรับทุกคน</p>
        
        <div class="flex flex-col gap-5 w-full max-w-md">
            <!-- จุดที่แก้ไข: ลดขนาดปุ่ม (text-4xl -> 3xl, py-6 px-10 -> py-5 px-8) -->
            <button onclick="startGame()" class="big-btn bg-green-500 hover:bg-green-600 text-white text-3xl font-bold py-5 px-8 rounded-[2rem] shadow-xl focus:outline-none focus:ring-8 ring-green-300">
                ▶ เริ่มเกม
            </button>
            <button onclick="testAudio()" class="big-btn bg-blue-100 hover:bg-blue-200 text-blue-700 text-2xl font-bold py-5 px-8 rounded-[2rem] shadow-lg focus:outline-none focus:ring-8 ring-blue-300">
                🔊 ทดสอบเสียง
            </button>
        </div>
    </div>

    <!-- ================= หน้าเล่นเกม (Game Screen) ================= -->
    <div id="gameScreen" class="hidden flex-1 flex flex-col w-full max-w-5xl mx-auto p-4 md:p-6">
        
        <!-- แถบสถานะด้านบน -->
        <!-- จุดที่แก้ไข: ลดขนาดแถบสถานะ (p-6 -> p-5, text-4xl -> 3xl, text-5xl -> 4xl) -->
        <div class="flex justify-between items-center bg-white p-3 md:p-5 rounded-3xl shadow-md mb-5 relative">
            <div class="text-xl md:text-3xl font-bold text-blue-600">
                ⭐ คะแนน: <span id="scoreDisplay">0</span>
            </div>
            <div id="timerDisplay" class="text-2xl md:text-4xl font-bold text-gray-700">
                03:00
            </div>
            <div id="scoreEffectArea" class="absolute left-10 top-16"></div>
        </div>

        <!-- พื้นที่คำถาม -->
        <div class="flex flex-col items-center justify-center bg-white p-5 md:p-8 rounded-3xl shadow-md mb-5 text-center">
            <!-- จุดที่แก้ไข: ลดขนาดข้อความคำถาม (text-5xl -> 4xl) -->
            <h2 id="questionText" class="text-3xl md:text-4xl font-bold mb-5">สิ่งนี้คืออะไร?</h2>
            
            <button onclick="speakQuestion()" class="big-btn bg-blue-100 text-blue-700 px-6 py-3 rounded-full text-xl md:text-2xl font-bold flex items-center gap-3 hover:bg-blue-200 focus:outline-none focus:ring-4 ring-blue-300 mb-5">
                🔊 ฟังคำถาม
            </button>

            <!-- รูปภาพขนาดใหญ่ (Emoji) -->
            <!-- จุดที่แก้ไข: ลดขนาดรูปภาพคำถาม (text-[160px] -> [130px]) -->
            <div id="questionImage" class="text-7xl md:text-[130px] leading-none mb-2 drop-shadow-lg">
                🏠
            </div>
        </div>

        <!-- ข้อความแจ้งเตือน ถูก/ผิด -->
        <!-- จุดที่แก้ไข: ลดขนาดข้อความ (text-5xl -> 4xl) -->
        <div id="feedbackText" class="text-center text-3xl md:text-4xl font-bold h-12 mb-4 transition-opacity duration-300 opacity-0">
            <!-- จะแสดงคำว่า "เก่งมาก! ถูกต้อง" หรือ "ลองใหม่อีกครั้ง" -->
        </div>

        <!-- พื้นที่คำตอบ (2 ตัวเลือก) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-8 pb-10" id="optionsContainer">
            <!-- ตัวเลือกจะถูกสร้างด้วย JavaScript -->
        </div>
    </div>

    <!-- ================= หน้าจบเกม (Game Over Screen) ================= -->
    <div id="endScreen" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center h-screen">
        <!-- จุดที่แก้ไข: ลดขนาดหน้าจอจบเกม -->
        <h2 class="text-5xl md:text-7xl font-bold text-red-500 mb-6">หมดเวลาแล้ว!</h2>
        
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-lg mb-8">
            <p class="text-2xl md:text-3xl text-gray-600 mb-4">คะแนนของคุณ</p>
            <p class="text-6xl md:text-8xl font-bold text-yellow-500 mb-8" id="finalScore">0</p>
            
            <div class="text-xl md:text-2xl text-gray-700 text-left space-y-4">
                <p>✅ ตอบถูก: <span id="correctCount" class="font-bold text-green-600">0</span> ข้อ</p>
                <p>🎮 เล่นทั้งหมด: <span id="playedCount" class="font-bold text-blue-600">0</span> ข้อ</p>
            </div>
        </div>

        <button onclick="resetToStart()" class="big-btn bg-blue-500 hover:bg-blue-600 text-white text-3xl font-bold py-5 px-10 rounded-[2rem] shadow-xl focus:outline-none focus:ring-8 ring-blue-300">
            🔄 เล่นอีกครั้ง
        </button>
    </div>

    <script>
        // ================= ฐานข้อมูลคำศัพท์ (คลังภาพและคำ) =================
        const vocabulary = [
            { word: "บ้าน", icon: "🏠" }, { word: "โต๊ะ", icon: "🪑" },
            { word: "หนังสือ", icon: "📖" }, { word: "โทรศัพท์", icon: "📱" },
            { word: "แก้วน้ำ", icon: "🥛" }, { word: "ร่ม", icon: "☂️" },
            { word: "รองเท้า", icon: "👟" }, { word: "หมวก", icon: "🧢" },
            { word: "ปลา", icon: "🐟" }, { word: "แมว", icon: "🐱" },
            { word: "สุนัข", icon: "🐶" }, { word: "นก", icon: "🐦" },
            { word: "ช้าง", icon: "🐘" }, { word: "หมู", icon: "🐷" },
            { word: "ไก่", icon: "🐔" }, { word: "ม้า", icon: "🐴" },
            { word: "ข้าว", icon: "🍚" }, { word: "กล้วย", icon: "🍌" },
            { word: "แอปเปิล", icon: "🍎" }, { word: "ไข่", icon: "🥚" },
            { word: "น้ำ", icon: "💧" }, { word: "เค้ก", icon: "🍰" },
            { word: "แตงโม", icon: "🍉" }, { word: "ขนมปัง", icon: "🍞" },
            { word: "ดวงอาทิตย์", icon: "☀️" }, { word: "ต้นไม้", icon: "🌳" },
            { word: "ดอกไม้", icon: "🌸" }, { word: "ภูเขา", icon: "⛰️" },
            { word: "เมฆ", icon: "☁️" }, { word: "ไฟ", icon: "🔥" }
        ];

        // ================= ตัวแปรสถานะเกม =================
        let score = 0;
        let timeLeft = 180;
        let timerInterval;
        let isMuted = false;
        let currentCorrectAnswer = null;
        let playedQuestionsCount = 0;
        let correctAnswersCount = 0;
        let canAnswer = true;

        // ================= ระบบเสียงประกอบ (Web Audio API) =================
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(frequency, type, duration, volume = 0.1) {
            if (isMuted) return;
            initAudio();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function playSfxClick() { playTone(600, 'sine', 0.1, 0.05); }
        function playSfxCorrect() { 
            playTone(523.25, 'sine', 0.15, 0.1); 
            setTimeout(() => playTone(659.25, 'sine', 0.15, 0.1), 100); 
            setTimeout(() => playTone(783.99, 'sine', 0.3, 0.1), 200);  
        }
        function playSfxWrong() { 
            playTone(200, 'sawtooth', 0.3, 0.1); 
            setTimeout(() => playTone(150, 'sawtooth', 0.4, 0.1), 200);
        }
        function playSfxTimeout() {
            playTone(300, 'square', 0.5, 0.1);
            setTimeout(() => playTone(250, 'square', 0.8, 0.1), 400);
        }

        // ================= จุดที่แก้ไข: ระบบอ่านออกเสียงภาษาไทย (TTS สำหรับ Windows/Mobile) =================
        let thaiVoice = null;

        function loadThaiVoice() {
            if (!('speechSynthesis' in window)) {
                console.warn('Browser ไม่รองรับ Speech Synthesis');
                return;
            }

            const voices = window.speechSynthesis.getVoices();
            
            // ค้นหาเสียงภาษาไทย
            thaiVoice =
                voices.find(v => v.lang === 'th-TH') ||
                voices.find(v => v.lang.toLowerCase().startsWith('th')) ||
                null;

            // Debug Console ตามที่ขอ
            console.log('SpeechSynthesis supported:', 'speechSynthesis' in window);
            console.log('Available voices:', voices);
            if (thaiVoice) {
                console.log('Thai Voice selected:', thaiVoice.name);
            } else if (voices.length > 0) {
                console.warn('ไม่พบเสียงภาษาไทยในระบบ Browser นี้ ระบบจะใช้เสียง Default แทน');
            }
        }

        // รอจนกว่า Browser จะโหลดเสียงเสร็จ (สำคัญมากสำหรับ Windows Chrome/Edge)
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadThaiVoice;
            loadThaiVoice(); // เรียกครั้งแรกเผื่อเสียงโหลดเสร็จแล้ว
        }

        function speak(text) {
            if (isMuted) return;
            if (!('speechSynthesis' in window)) {
                console.warn('Speech Synthesis ไม่รองรับ');
                return;
            }

            // เคลียร์คิวเสียงเก่าก่อนพูดใหม่ทุกครั้ง เพื่อป้องกันเสียงค้าง/พูดซ้อน
            window.speechSynthesis.cancel();

            const speakNow = () => {
                const voices = window.speechSynthesis.getVoices();
                // หาเสียงไทยอีกครั้งเผื่อโหลดเสร็จทีหลัง
                const voice =
                    voices.find(v => v.lang === 'th-TH') ||
                    voices.find(v => v.lang.toLowerCase().startsWith('th')) ||
                    thaiVoice;

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 0.9;
                utterance.pitch = 1.0;
                utterance.volume = 1.0;

                if (voice) {
                    utterance.voice = voice;
                }

                window.speechSynthesis.speak(utterance);
            };

            // ถ้ามี voices โหลดมาแล้วให้พูดเลย
            if (window.speechSynthesis.getVoices().length > 0) {
                speakNow();
            } else {
                // ถ้า voices ยังไม่มา ให้รอโหลดเสร็จแล้วค่อยพูด (Fallback สำหรับครั้งแรก)
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.onvoiceschanged = null;
                    speakNow();
                    loadThaiVoice();
                };
            }
        }

        function testAudio() {
            initAudio();
            playSfxClick();
            speak("สวัสดีครับ ระบบเสียงพร้อมใช้งาน");
        }

        function toggleMute() {
            isMuted = !isMuted;
            const muteBtn = document.getElementById('muteBtn');
            if (isMuted) {
                muteBtn.innerHTML = "🔇 เสียงปิด";
                window.speechSynthesis.cancel();
            } else {
                muteBtn.innerHTML = "🔊 เสียงเปิด";
                initAudio();
                playSfxClick();
            }
        }

        function speakQuestion() {
            speak("สิ่งนี้คืออะไร " + currentCorrectAnswer.word);
        }

        // ================= ระบบจัดการเกม (Game Logic) =================

        function startGame() {
            initAudio(); 
            playSfxClick();
            
            // จุดที่แก้ไข: ให้ระบบทดสอบพูดทันทีเมื่อเริ่มเกมเพื่อปลดล็อก Autoplay Policy และตอบสนอง Request ของผู้ใช้
            speak("เริ่มเกม");
            
            score = 0;
            timeLeft = 180;
            playedQuestionsCount = 0;
            correctAnswersCount = 0;
            updateScoreDisplay();
            
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('timerDisplay').classList.remove('timer-warning');
            
            updateTimerDisplay();
            clearInterval(timerInterval);
            timerInterval = setInterval(timerTick, 1000);
            
            loadNextQuestion();
        }

        function timerTick() {
            timeLeft--;
            updateTimerDisplay();
            
            const timerEl = document.getElementById('timerDisplay');
            if (timeLeft === 30) timerEl.classList.add('timer-warning');
            
            if (timeLeft <= 0) endGame();
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function updateScoreDisplay() {
            document.getElementById('scoreDisplay').innerText = score;
        }

        function getRandomInt(max) {
            return Math.floor(Math.random() * max);
        }

        function loadNextQuestion() {
            canAnswer = true;
            playedQuestionsCount++;
            
            const feedback = document.getElementById('feedbackText');
            feedback.style.opacity = '0';
            
            const correctIndex = getRandomInt(vocabulary.length);
            currentCorrectAnswer = vocabulary[correctIndex];
            
            let wrongIndex = getRandomInt(vocabulary.length);
            while (wrongIndex === correctIndex) wrongIndex = getRandomInt(vocabulary.length);
            const wrongAnswer = vocabulary[wrongIndex];
            
            document.getElementById('questionImage').innerText = currentCorrectAnswer.icon;
            
            const options = [currentCorrectAnswer, wrongAnswer];
            if (Math.random() > 0.5) options.reverse(); 
            
            const container = document.getElementById('optionsContainer');
            container.innerHTML = ''; 
            
            options.forEach(option => {
                const isCorrect = option.word === currentCorrectAnswer.word;
                
                // จุดที่แก้ไข: ลดขนาดปุ่มคำตอบ 10-15% 
                // (p-8 -> p-6, text-[140px] -> [110px], text-6xl -> 5xl)
                const btnHTML = `
                    <button id="btn-${option.word}" onclick="handleAnswer('${option.word}', this)" 
                        class="big-btn w-full flex flex-col items-center justify-center p-6 bg-white rounded-[2.5rem] shadow-lg border-8 border-gray-100 hover:border-blue-300 focus:outline-none focus:border-blue-500 transition-all cursor-pointer">
                        
                        <div class="text-[80px] md:text-[110px] leading-none mb-4 drop-shadow-md">
                            ${option.icon}
                        </div>
                        
                        <div class="text-4xl md:text-5xl font-bold mb-6 text-gray-800">
                            ${option.word}
                        </div>
                        
                        <!-- จุดที่แก้ไข: ลดขนาดปุ่มฟังคำตอบ (px-8 py-4 -> px-6 py-3, text-3xl -> 2xl) -->
                        <div onclick="event.stopPropagation(); playSfxClick(); speak('${option.word}')" 
                            class="bg-blue-100 text-blue-700 px-6 py-3 rounded-full text-xl md:text-2xl font-bold flex items-center gap-3 hover:bg-blue-200 hover:scale-105 transition-transform border-4 border-blue-200">
                            🔊 ฟังคำว่า ${option.word}
                        </div>
                    </button>
                `;
                container.insertAdjacentHTML('beforeend', btnHTML);
            });
        }

        function handleAnswer(selectedWord, btnElement) {
            if (!canAnswer) return; 
            
            const feedback = document.getElementById('feedbackText');
            
            if (selectedWord === currentCorrectAnswer.word) {
                canAnswer = false; 
                correctAnswersCount++;
                score += 10;
                
                playSfxCorrect();
                speak("เก่งมาก ถูกต้อง " + selectedWord);
                
                btnElement.classList.add('correct-animation');
                
                feedback.innerText = "เก่งมาก! ถูกต้อง";
                feedback.className = "text-center text-3xl md:text-4xl font-bold h-12 mb-4 transition-opacity duration-300 text-green-600 opacity-100";
                
                showScoreAnimation();
                updateScoreDisplay();
                
                setTimeout(() => {
                    loadNextQuestion();
                }, 1500);
                
            } else {
                playSfxWrong();
                speak("ลองใหม่อีกครั้ง");
                
                btnElement.classList.add('shake-animation');
                setTimeout(() => btnElement.classList.remove('shake-animation'), 400); 
                
                feedback.innerText = "❌ ลองใหม่อีกครั้ง";
                feedback.className = "text-center text-3xl md:text-4xl font-bold h-12 mb-4 transition-opacity duration-300 text-red-500 opacity-100";
            }
        }

        function showScoreAnimation() {
            const area = document.getElementById('scoreEffectArea');
            const floater = document.createElement('div');
            floater.className = 'score-float';
            floater.innerText = '+10 ⭐';
            area.appendChild(floater);
            
            setTimeout(() => {
                floater.remove();
            }, 1000);
        }

        function endGame() {
            clearInterval(timerInterval);
            playSfxTimeout();
            speak("หมดเวลาแล้ว ตรวจสอบคะแนนของคุณได้เลยครับ");
            
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('endScreen').classList.remove('hidden');
            
            document.getElementById('finalScore').innerText = score;
            document.getElementById('correctCount').innerText = correctAnswersCount;
            document.getElementById('playedCount').innerText = playedQuestionsCount;
        }

        function resetToStart() {
            playSfxClick();
            document.getElementById('endScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
        }

        document.addEventListener('keydown', function(event) {
            if(event.key === "Enter" && document.activeElement.tagName === "BUTTON"){
                document.activeElement.click();
            }
        });

    </script>
</body>
</html>
